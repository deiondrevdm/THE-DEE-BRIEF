<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dee's Room</title>
<meta name="description" content="Dee's room on the internet. Books, records, trailers, writing and two cats. Click around.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Shadows+Into+Light&family=Oswald:wght@500;700&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Courier+Prime:wght@400;700&family=Instrument+Sans:wght@400;500;600&family=VT323&display=swap">
<style>
/* Layout: one illustrated bedroom fills the screen. Click an object and the camera zooms in; its contents open on a paper card. */
:root{
  --night:#1E1530;   /* the room's surroundings */
  --paper:#FBF1DE;   /* cards */
  --ink:#2A1E22;
  --muted:#6E5A5C;
  --white:#FFFDF6;
  --tomato:#F2542D; --sun:#F2B230; --teal:#2E8A86; --pink:#E86A8E; --cobalt:#3D57A6;
  --mint:#4CC38A; --sky:#5B9BFF; --lilac:#B39BFF; --tangerine:#FF9F1C; --glass:#F8E9C2;
  --display:"Shrikhand","Cooper Black",Georgia,serif;
  --hand:"Shadows Into Light","Bradley Hand","Segoe Print",cursive;
  --type:"Courier Prime","Courier New",Courier,monospace;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --pixel:"VT323","Courier New",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--white);font:16px/1.5 var(--body);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px dashed var(--sun);outline-offset:3px}

/* top bar + bottom nav */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--type);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#CDBBD0}
.brand b{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:0;text-transform:none;color:#FFD9E6;margin-right:10px;text-shadow:0 0 12px rgba(255,111,174,.7)}
.toggles{display:flex;gap:8px}
.tg{background:transparent;border:1.5px solid #5A4868;color:#E9DCEB;border-radius:999px;padding:5px 12px;font-family:var(--type);font-size:12px;letter-spacing:.06em;cursor:pointer}
.tg[aria-pressed="true"]{background:#FFE6A8;border-color:#FFE6A8;color:var(--ink)}
.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav span{font-family:var(--hand);font-size:20px;color:#CDBBD0;margin-right:4px;align-self:center}
.nav button{background:#2E2142;border:0;border-radius:999px;padding:6px 14px;font-family:var(--type);font-size:13px;color:#F3E6F4;cursor:pointer}
.nav button:hover{background:#FFE6A8;color:var(--ink)}

/* stage + scene */
.stage{position:relative;min-height:0}
.scroller{position:absolute;inset:0;overflow:auto;display:grid;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scene{margin:auto;position:relative;border-radius:6px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.scene svg{display:block;width:100%;height:100%}
.hot{cursor:pointer;outline:none;transition:filter .25s}
.hot:hover,.hot:focus-visible{filter:drop-shadow(0 0 3px #FFF6D8) drop-shadow(0 0 10px rgba(255,214,120,.9))}
.zoomed .hot{pointer-events:none}
.tip{position:absolute;z-index:6;pointer-events:none;background:var(--paper);color:var(--ink);font-family:var(--hand);font-size:20px;line-height:1.1;padding:5px 10px 6px;border:1.5px solid var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.35);transform:translate(-50%,calc(-100% - 16px)) rotate(-2deg);white-space:nowrap;opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.tip small{display:block;font-family:var(--type);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.hint{position:absolute;z-index:5;left:50%;bottom:14px;transform:translateX(-50%) rotate(-1.5deg);background:#FFE6A8;color:var(--ink);font-family:var(--hand);font-size:21px;padding:4px 14px;box-shadow:3px 3px 0 rgba(0,0,0,.35);transition:opacity .5s;pointer-events:none;white-space:nowrap}
.hint.gone{opacity:0}

/* ambient animation inside the room */
.twinkle{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.55}}
.steam path{animation:steam 3.5s ease-in-out infinite;opacity:0}
.steam path:nth-child(2){animation-delay:1.2s}
@keyframes steam{20%{opacity:.7}100%{opacity:0;transform:translateY(-22px)}}
.blob{animation:lava 9s ease-in-out infinite}
.blob.b2{animation-duration:12s;animation-delay:-4s}
@keyframes lava{50%{transform:translateY(-46px) scale(1.15,.9)}}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
#catB .breathe{animation-duration:4.4s}
@keyframes breathe{50%{transform:scale(1.02,1.05)}}
.cat.purring .breathe{animation:purr .07s linear infinite}
@keyframes purr{50%{transform:translate(.6px,-.6px) scale(1.01,1.03)}}
.cat .tail{transform-box:fill-box;transform-origin:100% 50%;animation:swish 5s ease-in-out infinite}
@keyframes swish{50%{transform:rotate(-6deg)}}
.zz{font-family:var(--hand);fill:#FFF1D6;opacity:0;animation:zz 6s ease-out infinite}
.zz:nth-of-type(2){animation-delay:2s}
@keyframes zz{10%{opacity:.9}100%{opacity:0;transform:translate(14px,-40px)}}
.prr{font-family:var(--hand);font-size:26px;fill:#FFF6D8;paint-order:stroke;stroke:#2A1E22;stroke-width:4px;animation:prr 2.4s ease-out forwards}
.heart{animation:prr 2.4s ease-out forwards}
@keyframes prr{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
.spin{transform-box:fill-box;transform-origin:50% 50%}
.music .spin{animation:rot 1.8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#arm{transform-box:view-box;transform-origin:576px 504px;transition:transform 1s ease}
.music #arm{transform:rotate(24deg)}
#beam,#scrGlow{opacity:0;transition:opacity 1s}
.movie #beam{opacity:1}.movie #scrGlow{opacity:1}
#scrGlow rect{animation:flick 2.4s steps(6) infinite}
@keyframes flick{0%{fill:#7FB2FF}30%{fill:#FFC66B}55%{fill:#FF7FA8}80%{fill:#9BE3B5}}
#nightTint{transition:opacity .8s}
.glow{transition:opacity .8s;mix-blend-mode:screen}
#skyDay,#sun{transition:opacity .8s}
.neon{font-family:var(--display);font-size:40px;fill:#FFE3EE;stroke:#FF6FAE;stroke-width:1.2px;filter:url(#neonGlow)}
.lamp-off .neon{animation:neon 5s infinite}
@keyframes neon{0%,92%,100%{opacity:1}93%{opacity:.4}95%{opacity:1}96%{opacity:.5}}

/* panel: the zoomed-in card */
.panel{position:absolute;inset:0;z-index:4;display:grid;place-items:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(ellipse at center,rgba(30,21,48,.15),rgba(30,21,48,.6));opacity:0;transition:opacity .4s}
.panel.on{opacity:1}
.pcard{width:100%;max-width:1060px;max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);box-shadow:8px 9px 0 rgba(0,0,0,.35);position:relative}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:18px 20px 0}
.phead h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1;margin:0;text-wrap:balance}
.phead p{font-family:var(--hand);font-size:21px;line-height:1.15;color:var(--muted);margin:4px 0 0}
.back{flex:none;background:var(--ink);color:var(--white);border:0;border-radius:999px;padding:8px 16px;font-family:var(--type);font-size:13px;cursor:pointer}
.back:hover{background:var(--tomato)}
.pbody{padding:16px 20px 22px}
.view[hidden]{display:none!important}

/* books: Artspace-style slider. Spines stand in a row; the current book swings round to show its cover. */
.arts{--bg:var(--sun);--ease:cubic-bezier(.65,0,.35,1);position:relative;overflow:hidden;border:1.5px solid var(--ink);box-shadow:6px 7px 0 rgba(36,27,22,.15);
  background-color:color-mix(in srgb,var(--bg) 22%,#ECE5D6);transition:background-color .9s ease;padding:12px 0 0}
.arts-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 16px;font-family:var(--type);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.arts-pg{display:flex;flex-wrap:wrap;justify-content:flex-end}
.arts-pg button{font:inherit;background:none;border:0;padding:6px 5px;color:var(--muted);cursor:pointer}
.arts-pg button[aria-current="true"]{color:var(--ink);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.arts-h{text-align:center;font-family:"IM Fell English",Georgia,serif;font-weight:400;text-transform:uppercase;font-size:clamp(42px,8.4vw,104px);line-height:.86;letter-spacing:-.02em;margin:14px 16px 6px}
.arts-h small{display:block;font-size:max(13px,.17em);letter-spacing:.05em;margin-bottom:.4em}
.arts-h sup{font-size:.6em}
.arts-vp{position:relative;height:380px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.arts-row{position:absolute;left:0;bottom:26px;display:flex;align-items:flex-end;gap:4px;transition:transform .9s var(--ease);will-change:transform}
.arts-row.snap,.arts-row.snap *{transition:none!important}
.bslot{--fg:var(--ink);position:relative;flex:none;width:var(--t);height:var(--H);padding:0;border:0;background:none;color:var(--fg);cursor:pointer;perspective:1500px;transition:width .9s var(--ease)}
.bslot.on{width:var(--cw);cursor:default}
.bslot::after{content:"";position:absolute;left:-6px;right:-6px;bottom:-9px;height:12px;background:radial-gradient(ellipse at center,rgba(36,27,22,.3),transparent 70%);pointer-events:none}
.bk{position:absolute;left:0;bottom:0;width:var(--cw);height:var(--H);transform-style:preserve-3d;transform-origin:0 50%;transform:rotateY(90deg);transition:transform .9s var(--ease)}
.bslot.on .bk{transform:rotateY(0)}
.bslot:not(.on):hover .bk{transform:translateY(-10px) rotateY(90deg);transition-duration:.3s}
.bslot:focus-visible{outline:none}.bslot:focus-visible .bk{outline:2px dashed var(--ink);outline-offset:4px}
.sp,.cv{position:absolute;left:0;top:0;height:100%;background:var(--bk);overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.sp{width:var(--t);transform-origin:0 50%;transform:rotateY(-90deg);writing-mode:vertical-rl;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0;line-height:1.02;text-align:left;
  box-shadow:inset 3px 0 0 rgba(0,0,0,.1),inset -3px 0 0 rgba(255,255,255,.14),inset 0 3px 0 rgba(255,255,255,.12)}
.sp b{font-weight:400;max-height:78%;overflow:hidden}
.sp small{font-size:10px;opacity:.75;white-space:nowrap}
.cv{width:100%;display:flex;flex-direction:column;justify-content:space-between;padding:10% 10% 9% 13%;text-align:left;
  box-shadow:inset 5px 0 0 rgba(0,0,0,.14),inset 8px 0 0 rgba(255,255,255,.14),inset 0 0 40px rgba(0,0,0,.08)}
.cv b{font-weight:400;overflow-wrap:break-word}
.cv small{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
/* three house styles, alternating down the shelf */
.v0 .sp b{font-family:"IM Fell English SC","IM Fell English",Georgia,serif;font-size:min(15px,calc(var(--t) * .3));letter-spacing:.03em}
.v0 .sp small{font-family:"IM Fell English",Georgia,serif;font-style:italic;font-size:11px}
.v0 .cv b{font-family:"IM Fell English",Georgia,serif;text-transform:uppercase;font-size:calc(var(--cw) * .12);line-height:.92;letter-spacing:-.01em}
.v0 .cv small{font-family:"IM Fell English",Georgia,serif;font-style:italic;text-transform:none;letter-spacing:0;font-size:calc(var(--cw) * .075)}
.v1 .sp b{font-family:Oswald,"Arial Narrow",sans-serif;font-weight:700;text-transform:uppercase;font-size:min(15px,calc(var(--t) * .32));letter-spacing:.02em}
.v1 .sp small{font-family:var(--type)}
.v1 .cv{flex-direction:column-reverse}
.v1 .cv b{font-family:Oswald,"Arial Narrow",sans-serif;font-weight:700;text-transform:uppercase;font-size:calc(var(--cw) * .1);line-height:.98}
.v1 .cv small{font-family:var(--type)}
.v2 .sp b{font-family:var(--type);font-weight:700;text-transform:uppercase;font-size:min(12px,calc(var(--t) * .25));letter-spacing:.14em}
.v2 .sp small{font-family:var(--type);letter-spacing:.1em}
.v2 .cv{justify-content:center;gap:14px;text-align:center;padding-left:12%}
.v2 .cv b{font-family:var(--body);font-weight:600;font-size:calc(var(--cw) * .1);line-height:1.02;border-top:1.5px solid currentColor;border-bottom:1.5px solid currentColor;padding:.5em 0}
.v2 .cv small{font-family:var(--type)}
.arts-ctl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 14px;border-top:1.5px solid var(--ink);font-family:var(--type);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.arts-ctl div{display:flex;gap:8px}
.arts-ctl button{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-size:18px;cursor:pointer;display:grid;place-items:center}
.arts-ctl button:hover{background:var(--ink);color:var(--white)}
.book-card{transition:opacity .35s}.book-card.fade{opacity:0}
.book-card{margin-top:44px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:start}
.book-card .count{font-family:var(--hand);font-size:24px;color:var(--muted)}
.book-card h3{font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:clamp(34px,5vw,54px);line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.01em}
.book-card .why{font-family:"IM Fell English",Georgia,serif;font-style:italic}
.book-card .by{font-family:var(--type);font-size:14px;color:var(--muted);margin:10px 0 14px}
.book-card .why{font-size:19px;max-width:52ch;margin:0}
.verdict{display:grid;gap:22px}
.verdict div{padding:22px 18px 16px;font-family:var(--hand);font-size:24px;line-height:1.15;box-shadow:4px 5px 0 rgba(36,27,22,.15)}
.verdict div:first-child{background:#EFE4C8;transform:rotate(1.2deg);--tape:#C9B48A}
.verdict div:last-child{background:#E8DDC2;transform:rotate(-1.2deg);--tape:#B9A57E}
.verdict div{background-image:linear-gradient(transparent 26px,rgba(170,60,50,.45) 26px 27px,transparent 27px),repeating-linear-gradient(transparent 0 27px,rgba(80,110,150,.18) 27px 28px);border:1px solid rgba(90,70,40,.25);color:#3A2C22}
.verdict small{display:block;font-family:var(--type);font-size:11px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}

.arts{box-shadow:none}
.arts-h{font-size:clamp(34px,6vw,72px)}
.book-card{margin-top:22px}

/* records */
.hifi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
.tt{position:relative;aspect-ratio:1.25;max-width:100%;background:linear-gradient(160deg,#A8713D,#7A4A22);border-radius:10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 10px 0 #4E2E15,0 18px 30px rgba(0,0,0,.25)}
.platter{position:absolute;left:6%;top:9%;width:66%;aspect-ratio:1;border-radius:50%;background:#2B2420;box-shadow:inset 0 0 0 4px #3B332D}
.rec{position:absolute;inset:4%;border-radius:50%;background:repeating-radial-gradient(circle,#141010 0 2px,#1F1916 2px 4px);display:grid;place-items:center}
.rec::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 10%,rgba(255,255,255,.12) 14%,transparent 20% 60%,rgba(255,255,255,.08) 64%,transparent 70%)}
.lab{width:36%;aspect-ratio:1;border-radius:50%;background:var(--c,var(--sun));display:grid;place-items:center;text-align:center;padding:8%;font-family:var(--hand);font-size:clamp(12px,1.4vw,16px);line-height:1;position:relative;z-index:1}
.lab::after{content:"";position:absolute;width:8%;aspect-ratio:1;border-radius:50%;background:#eee;left:46%;top:46%}
.tt.on .rec{animation:rot 1.8s linear infinite}
.tarm{position:absolute;right:9%;top:8%;width:9%;aspect-ratio:1;border-radius:50%;background:#D9D2C5;box-shadow:0 2px 0 #8E857A;transform-origin:50% 50%;transition:transform 1s ease;transform:rotate(-8deg)}
.tarm::after{content:"";position:absolute;left:44%;top:50%;width:14%;height:560%;background:#CFC8BC;border-radius:4px;transform-origin:50% 0;transform:rotate(14deg);box-shadow:1px 0 0 #8E857A}
.tt.on .tarm{transform:rotate(22deg)}
.ttbtn{position:absolute;right:6%;bottom:9%;width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);background:var(--sun);font-size:18px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.ttbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.crate{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sleeve{text-align:left;border:1.5px solid var(--ink);background:var(--c);padding:12px;min-height:150px;gap:10px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;position:relative;overflow:hidden;box-shadow:3px 4px 0 rgba(42,30,34,.2);transition:transform .2s}
.sleeve::before{content:"";position:absolute;right:-30%;bottom:-30%;width:80%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.22)}
.sleeve:hover{transform:translateY(-4px) rotate(-1deg)}
.sleeve[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:3px}
.sleeve b{font-family:var(--display);font-weight:400;font-size:clamp(16px,1.8vw,21px);line-height:1;position:relative}
.sleeve span{font-size:13px;line-height:1.3;position:relative}
.spot-host{margin-top:18px;min-height:152px}
.spot-host iframe{display:block;width:100%;border:0;border-radius:12px}
.small{font-family:var(--type);font-size:12px;color:var(--muted);margin-top:8px}

/* screen */
.cine{display:grid;gap:18px}
@media (min-width:900px){.cine{grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);align-items:start}.tickets{grid-template-columns:1fr}.out{grid-column:1/-1}}
.cine-scr{aspect-ratio:16/9;width:100%;background:#120D18;border:10px solid #2A1E22;border-radius:4px;display:grid;place-items:center;overflow:hidden;color:#F3E6F4;text-align:center}
.cine-scr iframe{width:100%;height:100%;border:0;display:block}
.cine-scr b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,44px);color:#FFE6A8}
.cine-scr span{font-family:var(--type);font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.tickets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ticket{text-align:left;background:var(--c);border:1.5px dashed var(--ink);padding:12px 14px;cursor:pointer;position:relative;display:grid;gap:4px;transition:transform .2s}
.ticket:hover{transform:rotate(-1deg) translateY(-2px)}
.ticket[aria-pressed="true"]{border-style:solid;box-shadow:4px 4px 0 var(--ink)}
.ticket small{font-family:var(--type);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.ticket b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1}
.ticket span{font-size:14px;line-height:1.35}
.ticket i{font-style:normal;font-family:var(--hand);font-size:18px}
.out{font-family:var(--type);font-size:12px;color:var(--muted)}
.out a{color:var(--ink)}

/* laptop */
.os{background:#C9D3E8;border:1.5px solid var(--ink);font-family:var(--body)}
.os-bar{display:flex;justify-content:space-between;background:var(--ink);color:#C9D3E8;font-family:var(--pixel);font-size:20px;padding:2px 12px}
.os-main{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;padding:14px}
.os-apps{display:flex;flex-direction:column;gap:10px}
.app{background:none;border:0;cursor:pointer;display:grid;justify-items:center;gap:4px;padding:8px 4px;font-family:var(--pixel);font-size:19px;color:var(--ink);border-radius:4px}
.app i{width:46px;height:40px;border:1.5px solid var(--ink);background:var(--c);border-radius:4px;display:grid;place-items:center;font-style:normal;font-size:20px;box-shadow:2px 2px 0 var(--ink)}
.app[aria-pressed="true"]{background:rgba(42,30,34,.12)}
.win{background:var(--white);border:1.5px solid var(--ink);box-shadow:4px 4px 0 rgba(42,30,34,.25);min-width:0}
.win-t{display:flex;align-items:center;gap:8px;border-bottom:1.5px solid var(--ink);padding:3px 10px;font-family:var(--pixel);font-size:20px;background:repeating-linear-gradient(transparent 0 3px,rgba(42,30,34,.12) 3px 4px)}
.win-t i{width:12px;height:12px;border:1.5px solid var(--ink);background:var(--white)}
.win-b{padding:14px 18px 18px;max-height:min(52vh,460px);overflow:auto}
.essay{border-bottom:1px dashed rgba(42,30,34,.35)}
.essay button{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline;text-align:left;background:none;border:0;padding:10px 0;cursor:pointer}
.essay .d,.essay .rt{font-family:var(--type);font-size:12px;color:var(--muted);white-space:nowrap}
.essay h3{margin:0;font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:21px;line-height:1.15}
.essay .body{padding:0 0 12px;max-width:62ch}
.essay .body p{margin:0 0 8px}
.tags{display:flex;gap:6px;margin-bottom:8px}.tags span{font-family:var(--type);font-size:11px;border:1px solid var(--ink);padding:1px 7px;border-radius:999px}
.wk-top{font-family:"IM Fell English",Georgia,serif;font-style:italic;font-size:18px;margin:0 0 12px;max-width:62ch}
.wk{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.wk li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px}
.wk .ty{font-family:var(--pixel);font-size:18px;background:var(--c);border:1.5px solid var(--ink);text-align:center;align-self:start;padding:0 4px}
.wk b{font-weight:600}.wk .by{font-family:var(--type);font-size:12px;color:var(--muted)}
.wk p{margin:2px 0 0;font-size:15px}
.mail label{display:block;font-family:"IM Fell English",Georgia,serif;font-size:20px;margin-bottom:10px}
.mail .row{display:flex;gap:8px;flex-wrap:wrap}
.mail input{flex:1 1 220px;min-width:0;font:inherit;padding:10px 12px;border:1.5px solid var(--ink);background:var(--white)}
.mail button{background:var(--tomato);color:var(--white);border:1.5px solid var(--ink);padding:10px 16px;font-family:var(--type);font-weight:700;cursor:pointer}

/* corkboard */
.cork{background-color:#C99A62;background-image:radial-gradient(rgba(90,55,25,.35) 1px,transparent 1.5px),radial-gradient(rgba(255,235,200,.25) 1px,transparent 1.5px);background-size:9px 9px,13px 13px;border:12px solid #8C5A33;padding:22px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px 18px}
.card{background:var(--c);color:var(--ink);padding:18px 14px 12px;position:relative;box-shadow:3px 5px 0 rgba(0,0,0,.25);display:grid;gap:4px;transform:rotate(var(--r))}
.card::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff8,transparent 40%),var(--pin);box-shadow:0 2px 2px rgba(0,0,0,.4)}
.card b{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.05;padding-right:70px}
.card .by{font-family:var(--type);font-size:12px}
.card p{margin:4px 0 0;font-size:14.5px;line-height:1.4}
.card .stamp{position:absolute;right:8px;top:8px;font-family:var(--type);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid currentColor;padding:1px 5px;transform:rotate(6deg);opacity:.8}

@media (max-width:760px){
  .hifi{grid-template-columns:1fr}
  .os-main{grid-template-columns:1fr}.os-apps{flex-direction:row;justify-content:space-around}
  .brand span{display:none}
  .phead{flex-direction:column-reverse;gap:10px}
  .nav span{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function lightsUp(){

  $("#nightTint").style.opacity=night?(lampOn?.16:.52):(lampOn?0:.12);
  $("#lampGlow").style.opacity=lampOn?(night?.85:.35):0;

function audio(){if(!sound)return null;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();AC.resume();return AC}catch(e){return null}}
function click(){const a=audio();if(!a)return;const n=a.sampleRate*.04,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,6);const s=a.createBufferSource();s.buffer=b;const g=a.createGain();g.gain.value=.35;s.connect(g).connect(a.destination);s.start()}
function purrSound(rate,pitch,dur=2.6){
  const a=audio();if(!a)return;const sr=a.sampleRate,n=Math.floor(sr*dur),buf=a.createBuffer(1,n,sr),d=buf.getChannelData(0);let b=0,mx=0;
  for(let i=0;i<n;i++){const t=i/sr;b=(b+.04*(Math.random()*2-1))*.985;
    const pulse=Math.pow(.5+.5*Math.sin(2*Math.PI*rate*t),3);
    const breath=.45+.55*Math.max(0,Math.sin(2*Math.PI*t/(dur/2)-.6));
    const env=Math.min(1,t/.2)*Math.min(1,(dur-t)/.4);
    d[i]=b*pulse*breath*env;mx=Math.max(mx,Math.abs(d[i]))}
  for(let i=0;i<n;i++)d[i]=d[i]/mx*.7;
  const s=a.createBufferSource();s.buffer=buf;const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=320*pitch;lp.Q.value=1.4;
  const g=a.createGain();g.gain.value=1.4;s.connect(lp).connect(g).connect(a.destination);s.start()}

function tween(to,ms,done){cancelAnimationFrame(raf);const from={...vb},t0=performance.now();if(reduce)ms=1;
  const step=t=>{const k=Math.min(1,(t-t0)/ms),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    setVB({x:from.x+(to.x-from.x)*e,y:from.y+(to.y-from.y)*e,w:from.w+(to.w-from.w)*e,h:from.h+(to.h-from.h)*e});
    if(k<1)raf=requestAnimationFrame(step);else done&&done()};raf=requestAnimationFrame(step)}
function fit(b){let w=b.w*1.1,h=b.h*1.1;if(w/h>1.6)h=w/1.6;else w=h*1.6;return {x:b.x+b.w/2-w/2,y:b.y+b.h/2-h/2,w,h}}

  </div><div class="book-card" id="bc"></div>`;
  const arts=el.querySelector(".arts"),vp=el.querySelector(".arts-vp"),row=el.querySelector(".arts-row"),slots=[...row.children];
  function layout(){
    const s=Math.max(.6,Math.min(1.05,vp.clientWidth/920));let x=0,cw=0,maxH=0;
    slots.forEach((d,k)=>{const b=BOOKS[k%N],H=Math.round(b.h*s*1.12),t=Math.round(b.w*s),c=Math.round(H*.7);

    const b=$("#winB");
    if(i===0){const list=[...WRITING].sort((a,b)=>b.d.localeCompare(a.d));
      const draw=()=>{b.innerHTML=list.map((w,j)=>{const dt=new Date(w.d+"T12:00:00");return `<article class="essay"><button aria-expanded="${j===open}" data-j="${j}"><span class="d">${dt.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}</span><h3>${esc(w.t)}</h3><span class="rt">${w.min} min ${j===open?"−":"+"}</span></button><div class="body" ${j===open?"":"hidden"}><div class="tags">${w.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>${w.p.map(p=>`<p>${esc(p)}</p>`).join("")}</div></article>`}).join("");
        b.querySelectorAll(".essay > button").forEach(x=>x.onclick=()=>{const j=+x.dataset.j;open=open===j?-1:j;draw()})};draw()}
    else if(i===1){const d=DIGEST[0],TC={Watched:"#FFC1D3",Read:"#FFE6A8",Listened:"#BFD4FF",Played:"#9BE3B5"};
      b.innerHTML=`<p class="wk-top">${esc(d.top)}</p><ul class="wk">${d.items.map(x=>`<li><span class="ty" style="--c:${TC[x.type]||"#eee"}">${esc(x.type.toLowerCase())}</span><div><b>${esc(x.title)}</b> <span class="by">${esc(x.by)} · ${"★".repeat(x.r)}</span><p>${esc(x.note)}</p></div></li>`).join("")}</ul><p class="small">${esc(d.date)}</p>`}
    else{b.innerHTML=`<form class="mail" id="mail"><label for="email">A letter now and then: what I'm reading, playing and watching.</label><div class="row"><input id="email" type="email" placeholder="you@example.com" autocomplete="email"><button>Sign me up</button></div><p class="small" id="mailNote" aria-live="polite"></p></form>`;
      $("#mail").onsubmit=e=>{e.preventDefault();const val=$("#email").value.trim();$("#mailNote").textContent=/^\S+@\S+\.\S+$/.test(val)?"Thanks! (This form isn't connected to a newsletter tool yet, so nothing was sent.)":"Add an email address with an @ and a domain."}}};
  v.querySelectorAll(".app").forEach(a=>a.onclick=()=>show(+a.dataset.i));show(0);
  const tick=()=>{const c=$("#osClock");if(c)c.textContent=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})};tick();setInterval(tick,30000);
}

/* corkboard */
function rBoard(v){
  const C=["#FFF1D6","#9BE3B5","#FFE6A8","#FFC1D3","#BFD4FF"],P=["#F2542D","#3D57A6","#2E8A86","#F2B230"];
  v.innerHTML=`<div class="cork">${NEWSLETTERS.map((n,i)=>`<article class="card" style="--c:${C[i%C.length]};--r:${[-2,1.5,-1,2.2,-1.6][i%5]}deg;--pin:${P[i%P.length]}"><span class="stamp">${esc(n.tag)}</span><b>${esc(n.name)}</b><span class="by">${esc(n.by)} · ${esc(n.cad)}</span><p>${esc(n.why)}</p></article>`).join("")}</div>`;
}

const start=location.hash.slice(1);if(ROOMS[start])setTimeout(()=>open(start),300);
</script>
