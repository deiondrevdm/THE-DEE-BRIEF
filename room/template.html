<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dee's Room</title>
<meta name="description" content="Dee's room on the internet. Books, records, trailers, writing and two cats. Click around.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Shadows+Into+Light&family=Oswald:wght@500;700&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Courier+Prime:wght@400;700&family=Instrument+Sans:wght@400;500;600&family=VT323&display=swap">
<style>
/* Layout: one illustrated bedroom fills the screen. Click an object and the camera zooms in; its contents open on a paper card. */
:root{
  --night:#1E1530;   /* the room's surroundings */
  --paper:#FBF1DE;   /* cards */
  --ink:#2A1E22;
  --muted:#6E5A5C;
  --white:#FFFDF6;
  --tomato:#F2542D; --sun:#F2B230; --teal:#2E8A86; --pink:#E86A8E; --cobalt:#3D57A6;
  --mint:#4CC38A; --sky:#5B9BFF; --lilac:#B39BFF; --tangerine:#FF9F1C; --glass:#F8E9C2;
  --display:"Shrikhand","Cooper Black",Georgia,serif;
  --hand:"Shadows Into Light","Bradley Hand","Segoe Print",cursive;
  --type:"Courier Prime","Courier New",Courier,monospace;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --pixel:"VT323","Courier New",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--white);font:16px/1.5 var(--body);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px dashed var(--sun);outline-offset:3px}

/* top bar + bottom nav */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--type);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#CDBBD0}
.brand b{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:0;text-transform:none;color:#FFD9E6;margin-right:10px;text-shadow:0 0 12px rgba(255,111,174,.7)}
.toggles{display:flex;gap:8px}
.tg{background:transparent;border:1.5px solid #5A4868;color:#E9DCEB;border-radius:999px;padding:5px 12px;font-family:var(--type);font-size:12px;letter-spacing:.06em;cursor:pointer}
.tg[aria-pressed="true"]{background:#FFE6A8;border-color:#FFE6A8;color:var(--ink)}
.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav span{font-family:var(--hand);font-size:20px;color:#CDBBD0;margin-right:4px;align-self:center}
.nav button{background:#2E2142;border:0;border-radius:999px;padding:6px 14px;font-family:var(--type);font-size:13px;color:#F3E6F4;cursor:pointer}
.nav button:hover{background:#FFE6A8;color:var(--ink)}

/* stage + scene */
.stage{position:relative;min-height:0}
.scroller{position:absolute;inset:0;overflow:auto;display:grid;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scene{margin:auto;position:relative;border-radius:6px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.scene svg{display:block;width:100%;height:100%}
.hot{cursor:pointer;outline:none;transition:filter .25s}
.hot:hover,.hot:focus-visible{filter:drop-shadow(0 0 3px #FFF6D8) drop-shadow(0 0 10px rgba(255,214,120,.9))}
.zoomed .hot{pointer-events:none}
.tip{position:absolute;z-index:6;pointer-events:none;background:var(--paper);color:var(--ink);font-family:var(--hand);font-size:20px;line-height:1.1;padding:5px 10px 6px;border:3px solid var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.35);transform:translate(-50%,calc(-100% - 16px)) rotate(-2deg);white-space:nowrap;opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.tip small{display:block;font-family:var(--type);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.hint{position:absolute;z-index:5;left:50%;bottom:14px;transform:translateX(-50%) rotate(-1.5deg);background:#FFE6A8;color:var(--ink);font-family:var(--hand);font-size:21px;padding:4px 14px;box-shadow:3px 3px 0 rgba(0,0,0,.35);transition:opacity .5s;pointer-events:none;white-space:nowrap}
.hint.gone{opacity:0}

/* ambient animation inside the room */
.twinkle{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.55}}
.steam path{animation:steam 3.5s ease-in-out infinite;opacity:0}
.steam path:nth-child(2){animation-delay:1.2s}
@keyframes steam{20%{opacity:.7}100%{opacity:0;transform:translateY(-22px)}}
.blob{animation:lava 9s ease-in-out infinite}
.blob.b2{animation-duration:12s;animation-delay:-4s}
@keyframes lava{50%{transform:translateY(-46px) scale(1.15,.9)}}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.02,1.05)}}
.cat.purring .breathe{animation:purr .07s linear infinite}
@keyframes purr{50%{transform:translate(.6px,-.6px) scale(1.01,1.03)}}
.leg{transform-box:fill-box;transform-origin:50% 0;animation:step .5s ease-in-out infinite alternate}
.leg.b{animation-delay:-.5s}
@keyframes step{from{transform:rotate(16deg)}to{transform:rotate(-16deg)}}
.walker{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2px)}}
#catB .breathe{animation:none}
.cat.purring .leg,.cat.purring .walker,#catB.idle .leg,#catB.idle .walker{animation-play-state:paused}
#catB.run .leg{animation-duration:.14s}#catB.run .walker{animation-duration:.14s}
#catB .tail{animation-duration:1.4s}
#catA .mad{display:none}#catA.angry .mad{display:inline}#catA.angry .sleep{display:none}
#catA .head{transform-box:fill-box;transform-origin:70% 60%}
#catA.angry .head{animation:lunge .18s ease-out 4 alternate}
#catA.angry .breathe{animation:none}
@keyframes lunge{to{transform:translate(-9px,-5px) rotate(-8deg)}}
.miata-mad .zz{display:none}
.hiss{font-family:var(--display);font-size:30px;fill:#FFE6A8;paint-order:stroke;stroke:#2A1E22;stroke-width:5px;animation:prr 1.6s ease-out forwards}
.car .wh{transform-box:fill-box;transform-origin:50% 50%}
.car.vroom .carbody{animation:vroom 1.1s cubic-bezier(.5,0,.3,1)}
.car.vroom .wh{animation:rot .25s linear 4}
@keyframes vroom{0%{transform:translateX(0)}18%{transform:translateX(-5px)}55%{transform:translateX(14px)}100%{transform:translateX(0)}}
.lava-burst .blob{animation-duration:2.4s!important}
#catB.purring .breathe{animation:purr .07s linear infinite}
.cat .tail{transform-box:fill-box;transform-origin:100% 50%;animation:swish 5s ease-in-out infinite}
@keyframes swish{50%{transform:rotate(-6deg)}}
.zz{font-family:var(--hand);fill:#FFF1D6;opacity:0;animation:zz 6s ease-out infinite}
.zz:nth-of-type(2){animation-delay:2s}
@keyframes zz{10%{opacity:.9}100%{opacity:0;transform:translate(14px,-40px)}}
.prr{font-family:var(--hand);font-size:26px;fill:#FFF6D8;paint-order:stroke;stroke:#2A1E22;stroke-width:4px;animation:prr 2.4s ease-out forwards}
.heart{animation:prr 2.4s ease-out forwards}
@keyframes prr{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
.spin{transform-box:fill-box;transform-origin:50% 50%}
.music .spin{animation:rot 1.8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#arm{transition:transform 1s ease}
.music #arm{transform:rotate(36deg)}
#beam,#scrGlow{opacity:0;transition:opacity 1s}
.movie #beam{opacity:1}.movie #scrGlow{opacity:1}
#scrGlow rect{animation:flick 2.4s steps(6) infinite}
@keyframes flick{0%{fill:#7FB2FF}30%{fill:#FFC66B}55%{fill:#FF7FA8}80%{fill:#9BE3B5}}
#nightTint{transition:opacity .8s}
.glow{transition:opacity .8s;mix-blend-mode:screen}
#skyDay,#sun{transition:opacity .8s}
.neon{font-family:var(--display);font-size:46px;fill:#FFE3EE;stroke:#FF6FAE;stroke-width:1.2px;filter:url(#neonGlow)}
.lamp-off .neon{animation:neon 5s infinite}
@keyframes neon{0%,92%,100%{opacity:1}93%{opacity:.4}95%{opacity:1}96%{opacity:.5}}

/* panel: the zoomed-in card */
.panel{position:absolute;inset:0;z-index:4;display:grid;place-items:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(ellipse at center,rgba(30,21,48,.15),rgba(30,21,48,.6));opacity:0;transition:opacity .4s}
.panel.on{opacity:1}
.pcard{width:100%;max-width:1060px;max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:8px 9px 0 rgba(0,0,0,.35);position:relative}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:18px 20px 0}
.phead h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1;margin:0;text-wrap:balance}
.phead p{font-family:var(--hand);font-size:21px;line-height:1.15;color:var(--muted);margin:4px 0 0}
.back{flex:none;background:var(--ink);color:var(--white);border:0;border-radius:999px;padding:8px 16px;font-family:var(--type);font-size:13px;cursor:pointer}
.back:hover{background:var(--tomato)}
.pbody{padding:16px 20px 22px}
.view[hidden]{display:none!important}

{{ARTS_CSS}}
.arts{box-shadow:none}
.arts-h{font-size:clamp(34px,6vw,72px)}
.book-card{margin-top:22px}

/* records */
.hifi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
.tt{position:relative;border:3px solid var(--ink);aspect-ratio:1.25;max-width:100%;background:linear-gradient(160deg,#A8713D,#7A4A22);border-radius:10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 10px 0 #4E2E15,0 18px 30px rgba(0,0,0,.25)}
.platter{position:absolute;left:6%;top:9%;width:66%;aspect-ratio:1;border-radius:50%;background:#2B2420;box-shadow:inset 0 0 0 4px #3B332D}
.rec{position:absolute;inset:4%;border-radius:50%;background:repeating-radial-gradient(circle,#141010 0 2px,#1F1916 2px 4px);display:grid;place-items:center}
.rec::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 10%,rgba(255,255,255,.12) 14%,transparent 20% 60%,rgba(255,255,255,.08) 64%,transparent 70%)}
.lab{width:36%;aspect-ratio:1;border-radius:50%;background:var(--c,var(--sun));display:grid;place-items:center;text-align:center;padding:8%;font-family:var(--hand);font-size:clamp(12px,1.4vw,16px);line-height:1;position:relative;z-index:1}
.lab::after{content:"";position:absolute;width:8%;aspect-ratio:1;border-radius:50%;background:#eee;left:46%;top:46%}
.tt.on .rec{animation:rot 1.8s linear infinite}
.tarm{position:absolute;right:9%;top:8%;width:9%;aspect-ratio:1;border-radius:50%;background:#D9D2C5;box-shadow:0 2px 0 #8E857A;transform-origin:50% 50%;transition:transform 1s ease;transform:rotate(-8deg)}
.tarm::after{content:"";position:absolute;left:44%;top:50%;width:14%;height:560%;background:#CFC8BC;border-radius:4px;transform-origin:50% 0;transform:rotate(14deg);box-shadow:1px 0 0 #8E857A}
.tt.on .tarm{transform:rotate(22deg)}
.ttbtn{position:absolute;right:6%;bottom:9%;width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);background:var(--sun);font-size:18px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.ttbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.crate{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sleeve{text-align:left;border:3px solid var(--ink);background:var(--c);padding:12px;min-height:150px;gap:10px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;position:relative;overflow:hidden;box-shadow:3px 4px 0 rgba(42,30,34,.2);transition:transform .2s}
.sleeve::before{content:"";position:absolute;right:-30%;bottom:-30%;width:80%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.22)}
.sleeve:hover{transform:translateY(-4px) rotate(-1deg)}
.sleeve[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:3px}
.sleeve b{font-family:var(--display);font-weight:400;font-size:clamp(16px,1.8vw,21px);line-height:1;position:relative}
.sleeve span{font-size:13px;line-height:1.3;position:relative}
.spot-host{margin-top:18px;min-height:152px}
.spot-host iframe{display:block;width:100%;border:0;border-radius:12px}
.small{font-family:var(--type);font-size:12px;color:var(--muted);margin-top:8px}

/* screen */
.tvset{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:18px;background:#E3DBC8;border:3px solid var(--ink);border-radius:26px;padding:18px;box-shadow:6px 7px 0 rgba(42,30,34,.25)}
.tvscr{position:relative;aspect-ratio:16/9;width:100%;border:12px solid #3B3550;border-radius:30px/24px;overflow:hidden;background:#1B2422;display:grid;place-items:center;color:#E9F2E6;text-align:center;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.tvscr iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tvscr b{display:block;font-family:var(--pixel);font-weight:400;font-size:clamp(28px,4vw,48px);letter-spacing:.06em}
.tvscr span{font-family:var(--pixel);font-size:20px;opacity:.8}
.tvscr::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.18) 2px 4px);border-radius:inherit}
.tvscr.static{background:repeating-radial-gradient(circle at 17% 32%,#ddd 0 1px,#333 1px 3px),#555;animation:snow .12s steps(3) infinite}
@keyframes snow{33%{background-position:7px 3px}66%{background-position:-5px 6px}}
.chans{display:flex;flex-direction:column;gap:10px;justify-content:center}
.chan{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:10px;text-align:left;background:#F6F0E2;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.chan:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chan i{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:conic-gradient(var(--ink) 0 8deg,var(--c) 8deg 360deg);font-style:normal;transition:transform .3s}
.chan[aria-pressed="true"]{background:var(--c)}
.chan[aria-pressed="true"] i{transform:rotate(120deg)}
.chan small{display:block;font-family:var(--type);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.chan b{font-family:var(--display);font-weight:400;font-size:18px;line-height:1}
.tvinfo{margin-top:16px;display:grid;gap:4px}
.tvinfo h3{margin:0;font-family:var(--display);font-weight:400;font-size:28px;line-height:1}
.tvinfo .by{font-family:var(--type);font-size:13px;color:var(--muted)}
.tvinfo p{margin:4px 0 0;max-width:62ch}
@media (max-width:760px){.tvset{grid-template-columns:1fr}.chans{flex-direction:row;flex-wrap:wrap}.chan{flex:1 1 140px}}
.games{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;align-items:start}
.cases{display:grid;gap:12px}
.case{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:#F6F0E2;border:3px solid var(--ink);border-radius:12px;padding:8px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.case:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.case i{width:58px;height:80px;border:3px solid var(--ink);border-radius:4px;background:var(--c);color:var(--fg);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:12px;line-height:1;text-align:center;padding:4px;box-shadow:inset 6px 0 0 rgba(255,255,255,.3)}
.case b{display:block;font-family:var(--display);font-weight:400;font-size:17px;line-height:1.05}
.case small{display:block;font-family:var(--type);font-size:11px;color:var(--muted);margin-top:4px}
.case[aria-pressed="true"]{background:#FFE6A8}
.gvid{position:relative;aspect-ratio:16/9;border:3px solid var(--ink);border-radius:8px;background:#141018;overflow:hidden}
.gvid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.greview{margin-top:14px;background:#FFF4DE;border:3px solid var(--ink);padding:14px 16px;box-shadow:4px 4px 0 var(--ink);transform:rotate(-.6deg)}
.greview small{font-family:var(--type);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.greview h3{margin:2px 0 6px;font-family:var(--display);font-weight:400;font-size:24px;line-height:1}
.greview p{margin:0 0 6px;max-width:62ch}
@media (max-width:760px){.games{grid-template-columns:1fr}}
.cine{display:grid;gap:18px}
@media (min-width:900px){.cine{grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);align-items:start}.tickets{grid-template-columns:1fr}.out{grid-column:1/-1}}
.cine-scr{aspect-ratio:16/9;width:100%;background:#120D18;border:10px solid #2A1E22;border-radius:4px;display:grid;place-items:center;overflow:hidden;color:#F3E6F4;text-align:center}
.cine-scr iframe{width:100%;height:100%;border:0;display:block}
.cine-scr b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,44px);color:#FFE6A8}
.cine-scr span{font-family:var(--type);font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.tickets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ticket{text-align:left;background:var(--c);border:3px dashed var(--ink);padding:12px 14px;cursor:pointer;position:relative;display:grid;gap:4px;transition:transform .2s}
.ticket:hover{transform:rotate(-1deg) translateY(-2px)}
.ticket[aria-pressed="true"]{border-style:solid;box-shadow:4px 4px 0 var(--ink)}
.ticket small{font-family:var(--type);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.ticket b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1}
.ticket span{font-size:14px;line-height:1.35}
.ticket i{font-style:normal;font-family:var(--hand);font-size:18px}
.out{font-family:var(--type);font-size:12px;color:var(--muted)}
.out a{color:var(--ink)}

/* laptop */
.os{background:#6F7FC6;border:16px solid #FF8A2A;border-radius:30px;box-shadow:inset 0 0 0 6px #F7F2EA,0 0 0 3px var(--ink),6px 8px 0 rgba(42,30,34,.3);padding:6px;font-family:var(--body);overflow:hidden}
.os-bar{display:flex;justify-content:space-between;gap:12px;background:#F4F2F0;color:var(--ink);font:600 13px/1 -apple-system,"Helvetica Neue",Arial,sans-serif;padding:7px 12px;border-bottom:2px solid var(--ink);border-radius:10px 10px 0 0}
.os-bar .menus{display:flex;gap:14px}.os-bar .menus b:first-child{font-weight:800}
.os-main{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;padding:14px}
.os-apps{display:flex;flex-direction:column;gap:10px}
.app{background:none;border:0;cursor:pointer;display:grid;justify-items:center;gap:4px;padding:8px 4px;font:600 13px/1.2 -apple-system,"Helvetica Neue",Arial,sans-serif;color:#fff;text-shadow:0 1px 0 #000;border-radius:4px}
.app i{width:46px;height:40px;border:3px solid var(--ink);background:var(--c);border-radius:4px;display:grid;place-items:center;font-style:normal;font-size:20px;box-shadow:2px 2px 0 var(--ink)}
.app[aria-pressed="true"]{background:rgba(20,20,60,.35)}
.win{background:var(--white);border:2px solid var(--ink);border-radius:4px 4px 0 0;box-shadow:4px 4px 0 rgba(42,30,34,.25);min-width:0}
.win-t{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--ink);padding:4px 10px;font:600 13px/1.2 -apple-system,"Helvetica Neue",Arial,sans-serif;background:#E6E3DE repeating-linear-gradient(transparent 0 2px,#BDB8C6 2px 3px)}
.win-t span{background:#E6E3DE;padding:0 8px;margin:0 auto}
.win-t i{width:12px;height:12px;border:3px solid var(--ink);background:var(--white)}
.win-b{padding:14px 18px 18px;max-height:min(52vh,460px);overflow:auto}
.essay{border-bottom:1px dashed rgba(42,30,34,.35)}
.essay button{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline;text-align:left;background:none;border:0;padding:10px 0;cursor:pointer}
.essay .d,.essay .rt{font-family:var(--type);font-size:12px;color:var(--muted);white-space:nowrap}
.essay h3{margin:0;font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:21px;line-height:1.15}
.essay .body{padding:0 0 12px;max-width:62ch}
.essay .body p{margin:0 0 8px}
.essay .sub{font-family:"IM Fell English",Georgia,serif;font-style:italic;font-size:17px}
.essay .more{font-family:var(--type);font-size:13px;font-weight:700;color:var(--ink);background:var(--sun);border:2px solid var(--ink);padding:4px 10px;display:inline-block;text-decoration:none;box-shadow:2px 2px 0 var(--ink)}
.essay .more:hover{background:var(--pink)}
.tags{display:flex;gap:6px;margin-bottom:8px}.tags span{font-family:var(--type);font-size:11px;border:1px solid var(--ink);padding:1px 7px;border-radius:999px}
.wk-top{font-family:"IM Fell English",Georgia,serif;font-style:italic;font-size:18px;margin:0 0 12px;max-width:62ch}
.wk{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.wk li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px}
.wk .ty{font-family:var(--pixel);font-size:18px;background:var(--c);border:3px solid var(--ink);text-align:center;align-self:start;padding:0 4px}
.wk b{font-weight:600}.wk .by{font-family:var(--type);font-size:12px;color:var(--muted)}
.wk p{margin:2px 0 0;font-size:15px}
.mail label{display:block;font-family:"IM Fell English",Georgia,serif;font-size:20px;margin-bottom:10px}
.mail .row{display:flex;gap:8px;flex-wrap:wrap}
.mail input{flex:1 1 220px;min-width:0;font:inherit;padding:10px 12px;border:3px solid var(--ink);background:var(--white)}
.mail button{background:var(--tomato);color:var(--white);border:3px solid var(--ink);padding:10px 16px;font-family:var(--type);font-weight:700;cursor:pointer}

/* corkboard */
.cork{background-color:#C99A62;background-image:radial-gradient(rgba(90,55,25,.35) 1px,transparent 1.5px),radial-gradient(rgba(255,235,200,.25) 1px,transparent 1.5px);background-size:9px 9px,13px 13px;border:12px solid #8C5A33;padding:22px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px 18px}
.card{background:var(--c);color:var(--ink);padding:18px 14px 12px;position:relative;box-shadow:3px 5px 0 rgba(0,0,0,.25);display:grid;gap:4px;transform:rotate(var(--r))}
.card::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff8,transparent 40%),var(--pin);box-shadow:0 2px 2px rgba(0,0,0,.4)}
.card b{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.05;padding-right:70px}
.card .by{font-family:var(--type);font-size:12px}
.card p{margin:4px 0 0;font-size:14.5px;line-height:1.4}
.card .stamp{position:absolute;right:8px;top:8px;font-family:var(--type);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid currentColor;padding:1px 5px;transform:rotate(6deg);opacity:.8}

@media (max-width:760px){
  .hifi{grid-template-columns:1fr}
  .os-main{grid-template-columns:1fr}.os-apps{flex-direction:row;justify-content:space-around}
  .brand span{display:none}
  .phead{flex-direction:column-reverse;gap:10px}
  .nav span{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<header class="bar">
  <div class="brand"><b>Dee's room</b><span>the dee brief · click anything</span></div>
  <div class="toggles"><a class="tg" href="/THE-DEE-BRIEF/classic/" style="text-decoration:none">classic site</a><button class="tg" id="tgLamp" aria-pressed="true">lamp</button><button class="tg" id="tgSound" aria-pressed="true">sound</button></div>
</header>

<main class="stage" id="stage">
  <div class="scroller" id="scroller">
    <div class="scene" id="scene">
{{SVG}}
    </div>
  </div>
  <div class="tip" id="tip"></div>
  <div class="hint" id="hint">click around. the cats like it.</div>
  <div class="panel" id="panel" hidden>
    <div class="pcard" role="dialog" aria-modal="true" aria-labelledby="pTitle">
      <div class="phead"><div><h2 id="pTitle"></h2><p id="pSub"></p></div><button class="back" id="back">← back to the room</button></div>
      <div class="pbody">
        <div class="view" id="v-books" hidden></div>
        <div class="view" id="v-records" hidden></div>
        <div class="view" id="v-screen" hidden></div>
        <div class="view" id="v-laptop" hidden></div>
        <div class="view" id="v-board" hidden></div>
        <div class="view" id="v-games" hidden></div>
      </div>
    </div>
  </div>
</main>

<nav class="nav" aria-label="Things in the room">
  <span>look at</span>
  <button data-go="books">bookshelf</button><button data-go="records">records</button><button data-go="screen">tv</button><button data-go="games">ps2</button><button data-go="laptop">laptop</button><button data-go="board">corkboard</button><button data-cat="catA">Miata</button><button data-cat="catB">Supra</button>
</nav>

<script>
{{DATA}}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const NS="http://www.w3.org/2000/svg";
const svg=$("#room"),scene=$("#scene"),stage=$("#stage"),scroller=$("#scroller");

/* Rename the cats here. */
const GAMES=[
  {title:"Mixtape",by:"Beethoven & Dinosaur · Annapurna Interactive · 2025",yt:"iNkOgNAomio",c:"#FF6FAE",fg:"#2A1E22",review:"One last night with your best friends before everything changes, set to a soundtrack you'd actually put on a mixtape. Short, loud and very nostalgic."},
  {title:"Need for Speed: Underground 2",by:"EA Black Box · 2004 · PS2",yt:"4zdeNN2ex6E",c:"#151418",fg:"#FF9F1C",review:"Neon, rain-slicked streets and far too many hours in the body-kit menu. The reason the toy cars over my bed exist."},
  {title:"Animal Crossing: New Horizons",by:"Nintendo · 2020",yt:"_3YNL0OWio0",c:"#7FD36A",fg:"#2A1E22",review:"Paying off a raccoon's mortgage one fish at a time. The most peaceful bad financial decision I've ever made."}
];
let GAMESEL=null;
const CATS={catA:{name:"Miata",rate:23,pitch:1,tip:"do not touch"},catB:{name:"Supra",rate:27,pitch:1.25,tip:"catch her if you can"}}; /* catA: ginger on the bed (bites). catB: calico on the floor (runs, then purrs). */

const ROOMS={
  books:{t:"The bookshelf",s:"Tap a spine and it turns to face you. What I'm reading, what I've read and what's next."},
  records:{t:"Records",s:"Pick a sleeve, drop the needle. It keeps playing while you walk around the room."},
  screen:{t:"The TV",s:"Three channels: one movie, one series, one cartoon. Turn the dial."},
  games:{t:"The PS2",s:"Games I've played. Pick a case to see some gameplay."},
  laptop:{t:"The old Mac",s:"Still boots. Essays from my Substack, this week's notes and the mailing list."},
  board:{t:"The corkboard",s:"Newsletters I actually open. Pinned so I don't forget them."}
};
const TIPS={books:["the bookshelf","books I'd lend you"],records:["the record player","playlists"],screen:["the TV","movie · series · animation"],lava:["the lava lamp","click to change colour"],f40:["Ferrari F40","1:18, do not touch"],r34:["Nissan Skyline GT-R R34","1:18, do not touch"],e30:["BMW E30","1:18, do not touch"],laptop:["the old Mac","writing & notes"],games:["the PS2","games I've played"],board:["the corkboard","newsletters"],lamp:["the lamp","on / off"],win:["the window","day / night"]};

function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e}
const rnd=Math.random;

/* ---------- sizing: the room keeps its 16:10 shape; on phones it scrolls sideways ---------- */
function size(){
  const W=stage.clientWidth,H=stage.clientHeight;let w,h;
  if(W/H>=1.6){h=H;w=H*1.6}else if(W>=760){w=W;h=W/1.6}else{h=H;w=H*1.6}
  scene.style.width=w+"px";scene.style.height=h+"px";return {W,w}}
const first=size();
if(first.w>first.W)$("#hint").textContent="swipe to look around. tap the cats.";
if(first.w>first.W)scroller.scrollLeft=(first.w-first.W)/2+(1080/1600-.5)*first.w;
new ResizeObserver(size).observe(stage);

/* ---------- light, sound ---------- */
let lampOn=true,night=true,sound=true,AC=null;
function lightsUp(){
  svg.classList.toggle("lamp-off",!lampOn);
  $("#nightTint").style.opacity=night?(lampOn?.16:.52):(lampOn?0:.12);
  $("#lampGlow").style.opacity=lampOn?(night?.85:.35):0;
  $("#lampShade").setAttribute("fill",lampOn?"#FF7A45":"#C8502A");
  document.querySelectorAll(".glowb").forEach(b=>b.style.display=night?"":"none");
  $("#skyDay").style.opacity=night?0:1;$("#sun").style.opacity=night?0:1;
  $("#tgLamp").setAttribute("aria-pressed",lampOn);
}
function audio(){if(!sound)return null;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();AC.resume();return AC}catch(e){return null}}
function click(){const a=audio();if(!a)return;const n=a.sampleRate*.04,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,6);const s=a.createBufferSource();s.buffer=b;const g=a.createGain();g.gain.value=.35;s.connect(g).connect(a.destination);s.start()}
function purrSound(rate,pitch,dur=2.6){
  const a=audio();if(!a)return;const sr=a.sampleRate,n=Math.floor(sr*dur),buf=a.createBuffer(1,n,sr),d=buf.getChannelData(0);let b=0,mx=0;
  for(let i=0;i<n;i++){const t=i/sr;b=(b+.04*(Math.random()*2-1))*.985;
    const pulse=Math.pow(.5+.5*Math.sin(2*Math.PI*rate*t),3);
    const breath=.45+.55*Math.max(0,Math.sin(2*Math.PI*t/(dur/2)-.6));
    const env=Math.min(1,t/.2)*Math.min(1,(dur-t)/.4);
    d[i]=b*pulse*breath*env;mx=Math.max(mx,Math.abs(d[i]))}
  for(let i=0;i<n;i++)d[i]=d[i]/mx*.7;
  const s=a.createBufferSource();s.buffer=buf;const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=320*pitch;lp.Q.value=1.4;
  const g=a.createGain();g.gain.value=1.4;s.connect(lp).connect(g).connect(a.destination);s.start()}

/* ---------- cats ---------- */
function svgPt(cx,cy){const m=svg.getScreenCTM();if(!m)return{x:0,y:0};const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(m.inverse())}
function svgBox(node){const r=node.getBoundingClientRect(),a=svgPt(r.left,r.top),b=svgPt(r.right,r.bottom);return{x:a.x,y:a.y,width:b.x-a.x,height:b.y-a.y}}
function floatText(words,bb,cls="prr"){const g=$("#fx");words.forEach((w,i)=>{const t=el("text",{x:bb.x+bb.width*(.25+i*.35),y:bb.y-4,class:cls,style:`animation-delay:${i*.35}s`},g);t.textContent=w;setTimeout(()=>t.remove(),3200)})}
function purr(id){
  const c=$("#"+id),cfg=CATS[id];if(!c)return;dismissHint();
  purrSound(cfg.rate,cfg.pitch);
  c.classList.add("purring");clearTimeout(c._t);c._t=setTimeout(()=>c.classList.remove("purring"),2600);
  const bb=svgBox(c),g=$("#fx");floatText(["prrr","prrrr…"],bb);
  for(let i=0;i<3;i++){const h=el("path",{d:"M0 4 C0 -2 8 -2 8 4 C8 -2 16 -2 16 4 C16 10 8 14 8 18 C8 14 0 10 0 4Z",fill:"#FF6FAE",class:"heart",transform:`translate(${bb.x+bb.width*(.2+i*.3)} ${bb.y+10})`,style:`animation-delay:${.2+i*.35}s;opacity:0`},g);setTimeout(()=>h.remove(),3400)}
  showTip(c,[cfg.name,"purring"]);
}
function hissSound(){const a=audio();if(!a)return;const t=a.currentTime,n=a.sampleRate*.9|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=b;const hp=a.createBiquadFilter();hp.type="highpass";hp.frequency.value=2600;const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.05);g.gain.exponentialRampToValueAtTime(.01,t+.9);s.connect(hp).connect(g).connect(a.destination);s.start(t);
  const o=a.createOscillator(),og=a.createGain();o.frequency.setValueAtTime(190,t+.05);o.frequency.exponentialRampToValueAtTime(60,t+.16);og.gain.setValueAtTime(.6,t+.05);og.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(og).connect(a.destination);o.start(t+.05);o.stop(t+.2)}
let miataBusy=false;
function miata(){
  const c=$("#catA");if(miataBusy||!c)return;miataBusy=true;dismissHint();
  hissSound();c.classList.add("angry");svg.classList.add("miata-mad");
  floatText(["HSSSS!","*chomp*"],svgBox(c),"hiss");showTip(c,["Miata","told you"]);
  setTimeout(()=>{c.classList.remove("angry");svg.classList.remove("miata-mad");showTip(c,["Miata","back to sleep"]);setTimeout(hideTip,1400);miataBusy=false},1900);
}
function pet(id){if(id==="catA")miata();else supraPoke()}

/* Supra wanders the floor, bolts when the pointer comes near, and gives in after a few escapes */
const SUP={x:300,y:560,tx:300,ty:560,state:"pause",wait:1,flees:0,tiredAt:0,lastNear:0,lastPurr:0,face:1};
const supPos=$("#supraPos"),supCat=$("#catB"),supFlip=supCat&&supCat.querySelector(".flip");
const toScr=(x,y)=>[640+x-.78*y,560+.2*x+.5*y];
const toFloor=(sx,sy)=>{const a=sx-640,b=sy-560,y=(b-.2*a)/.656;return[a+.78*y,y]};
const clampF=(x,y)=>{x=Math.max(280,Math.min(600,x));y=Math.max(470,Math.min(790-.4*x,y));return[x,y]};
const randF=()=>clampF(280+Math.random()*320,470+Math.random()*220);
let ptr=null;
function supFlee(px,py){
  let dx=SUP.x-px,dy=SUP.y-py,L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
  let [tx,ty]=clampF(SUP.x+dx*230,SUP.y+dy*230);
  if(Math.hypot(tx-SUP.x,ty-SUP.y)<90){let best=null,bd=-1;for(let k=0;k<10;k++){const c=randF(),d=Math.hypot(c[0]-px,c[1]-py);if(d>bd){bd=d;best=c}}[tx,ty]=best}
  SUP.tx=tx;SUP.ty=ty;SUP.state="run";SUP.flees++;hideTip();
}
function supraPoke(){
  if(!supCat)return;dismissHint();
  if(reduce||SUP.state==="tired"){purr("catB");SUP.lastPurr=performance.now();return}
  const p=ptr||[SUP.x-60,SUP.y];supFlee(p[0],p[1]);
}
function supTick(now,dt){
  if(!supCat)return;
  if(ptr&&!openId){const d=Math.hypot(ptr[0]-SUP.x,ptr[1]-SUP.y);
    if(d<140){SUP.lastNear=now;
      if(SUP.state==="tired"){if(now-SUP.lastPurr>3500){SUP.lastPurr=now;purr("catB")}}
      else if(SUP.state!=="run")supFlee(ptr[0],ptr[1])}}
  if(SUP.state==="run"||SUP.state==="walk"){
    const sp=SUP.state==="run"?320:45,dx=SUP.tx-SUP.x,dy=SUP.ty-SUP.y,L=Math.hypot(dx,dy),step=sp*dt;
    const [sx0]=toScr(SUP.x,SUP.y);
    if(L<=step){SUP.x=SUP.tx;SUP.y=SUP.ty;
      if(SUP.state==="run"&&SUP.flees>=3){SUP.state="tired";SUP.tiredAt=now;SUP.lastPurr=now;purr("catB")}
      else{SUP.state="pause";SUP.wait=SUP.state==="run"?.4:1+Math.random()*2.5}}
    else{SUP.x+=dx/L*step;SUP.y+=dy/L*step}
    const [sx1]=toScr(SUP.x,SUP.y);if(Math.abs(sx1-sx0)>.01)SUP.face=sx1>sx0?1:-1;
  }else if(SUP.state==="pause"){SUP.wait-=dt;if(SUP.wait<=0&&!reduce){[SUP.tx,SUP.ty]=randF();SUP.state="walk"}}
  else if(SUP.state==="tired"){if(now-SUP.tiredAt>12000&&now-SUP.lastNear>6000){SUP.state="pause";SUP.wait=.5;SUP.flees=0}}
  const [sx,sy]=toScr(SUP.x,SUP.y);
  supPos.setAttribute("transform",`translate(${sx.toFixed(1)} ${sy.toFixed(1)})`);
  supFlip.setAttribute("transform",SUP.face<0?"scale(-1 1)":"");
  supCat.classList.toggle("run",SUP.state==="run");
  supCat.classList.toggle("idle",SUP.state==="pause"||SUP.state==="tired");
}
let lastT=performance.now();
(function loop(t){const dt=Math.min(.05,(t-lastT)/1000);lastT=t;if(!document.hidden)supTick(t,dt);requestAnimationFrame(loop)})(lastT);
scene.addEventListener("pointermove",e=>{const p=svgPt(e.clientX,e.clientY);ptr=toFloor(p.x,p.y)});
scene.addEventListener("pointerleave",()=>{ptr=null});

/* lava lamp + toy cars */
const LAVA=[["#FFB36E","#FF5C8A","#FFE6A8","#FF7A8A"],["#7FE0FF","#6A5CFF","#E6FBFF","#7FB2FF"],["#B6F09C","#1FB89A","#F4FFE0","#6FE3B0"],["#FFD36E","#C24BFF","#FFF4C2","#D98BFF"],["#FF6B6B","#7A1FA2","#FFD1E0","#FF6B9A"]];
let lavaI=0;
function lava(){
  lavaI=(lavaI+1)%LAVA.length;const [a,b,blob,glow]=LAVA[lavaI];dismissHint();
  $("#lava0").setAttribute("stop-color",a);$("#lava1").setAttribute("stop-color",b);
  document.querySelectorAll(".lavablob").forEach(x=>x.setAttribute("fill",blob));
  $("#lavaGlowStop").setAttribute("stop-color",glow);document.querySelector("#lavaGlowG stop:last-child").setAttribute("stop-color",glow);
  svg.classList.add("lava-burst");clearTimeout(lava._t);lava._t=setTimeout(()=>svg.classList.remove("lava-burst"),3000);
  const ac=audio();if(ac){const t=ac.currentTime;[0,.12,.26].forEach((d,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.setValueAtTime(420+i*90,t+d);o.frequency.exponentialRampToValueAtTime(160,t+d+.12);g.gain.setValueAtTime(.18,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+.14);o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+.15)})}
}
function vroom(node){
  node.classList.remove("vroom");void node.getBoundingClientRect();node.classList.add("vroom");dismissHint();
  const ac=audio();if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();
  o.type="sawtooth";o.frequency.setValueAtTime(55,t);o.frequency.exponentialRampToValueAtTime(190,t+.45);o.frequency.exponentialRampToValueAtTime(70,t+1);
  f.type="lowpass";f.frequency.value=900;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+1.05);
  o.connect(f).connect(g).connect(ac.destination);o.start(t);o.stop(t+1.1);
}

/* ---------- tooltip ---------- */
const tip=$("#tip");
function showTip(node,[a,b]){const r=node.getBoundingClientRect(),s=stage.getBoundingClientRect();tip.innerHTML=`${esc(a)}<small>${esc(b)}</small>`;tip.style.left=(r.left+r.width/2-s.left)+"px";tip.style.top=(Math.max(r.top-s.top,40))+"px";tip.classList.add("on")}
function hideTip(){tip.classList.remove("on")}
let hinted=false;function dismissHint(){if(hinted)return;hinted=true;$("#hint").classList.add("gone")}

/* ---------- camera ---------- */
const VB0={x:0,y:0,w:1600,h:1000};let vb={...VB0},raf=0,openId=null;
const setVB=b=>{vb=b;svg.setAttribute("viewBox",`${b.x} ${b.y} ${b.w} ${b.h}`)};
function tween(to,ms,done){cancelAnimationFrame(raf);const from={...vb},t0=performance.now();if(reduce)ms=1;
  const step=t=>{const k=Math.min(1,(t-t0)/ms),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    setVB({x:from.x+(to.x-from.x)*e,y:from.y+(to.y-from.y)*e,w:from.w+(to.w-from.w)*e,h:from.h+(to.h-from.h)*e});
    if(k<1)raf=requestAnimationFrame(step);else done&&done()};raf=requestAnimationFrame(step)}
function fit(b){let w=b.w*1.1,h=b.h*1.1;if(w/h>1.6)h=w/1.6;else w=h*1.6;return {x:b.x+b.w/2-w/2,y:b.y+b.h/2-h/2,w,h}}
const built={};
let lastFocus=null;
function open(id){
  const R=ROOMS[id];if(!R||openId===id)return;dismissHint();hideTip();
  lastFocus=document.activeElement;
  if(openId)closeView(openId);
  openId=id;scene.classList.add("zoomed");
  if(!built[id]){BUILD[id]($("#v-"+id));built[id]=true}
  const bb=(document.querySelector(`#room [data-zoom="${id}"]`)||document.querySelector(`#room [data-go="${id}"]`)).getBBox();tween(fit({x:bb.x,y:bb.y,w:bb.width,h:bb.height}),900,()=>{
    $("#pTitle").textContent=R.t;$("#pSub").textContent=R.s;
    document.querySelectorAll(".view").forEach(v=>v.hidden=v.id!=="v-"+id);
    const p=$("#panel");p.hidden=false;requestAnimationFrame(()=>p.classList.add("on"));$("#back").focus();
    ENTER[id]&&ENTER[id]();
  });
  if(location.hash!=="#"+id)history.replaceState(null,"","#"+id);
}
function closeView(id){LEAVE[id]&&LEAVE[id]()}
function close(){
  if(!openId)return;const id=openId;openId=null;closeView(id);
  const p=$("#panel");p.classList.remove("on");setTimeout(()=>{if(!openId)p.hidden=true},reduce?0:350);
  tween(VB0,800,()=>scene.classList.remove("zoomed"));
  history.replaceState(null,"",location.pathname+location.search);
  lastFocus&&lastFocus.focus&&lastFocus.focus({preventScroll:true});
}
$("#back").onclick=close;
$("#panel").addEventListener("click",e=>{if(e.target.id==="panel")close()});
addEventListener("keydown",e=>{if(e.key==="Escape")close()});
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(ROOMS[h])open(h);else close()});

/* ---------- hotspots ---------- */
function act(node){
  const go=node.dataset.go,cat=node.dataset.cat,tg=node.dataset.toggle;
  if(go){if(node.dataset.game!=null){GAMESEL=+node.dataset.game;if(openId==="games"&&ENTER.games)ENTER.games()}open(go)}else if(cat)pet(cat);
  else if(tg==="lamp"){lampOn=!lampOn;click();lightsUp();dismissHint()}
  else if(tg==="win"){night=!night;click();lightsUp();dismissHint()}
  else if(tg==="lava")lava();
  else if(tg==="car")vroom(node);
}
document.querySelectorAll(".hot").forEach(h=>{
  h.setAttribute("tabindex","0");h.setAttribute("role","button");
  const key=h.dataset.car||h.dataset.go||h.dataset.toggle,label=h.dataset.cat?[CATS[h.dataset.cat].name,CATS[h.dataset.cat].tip]:h.dataset.game!=null?[GAMES[+h.dataset.game].title,"click for my take"]:TIPS[key];
  h.setAttribute("aria-label",label.join(", "));
  h.addEventListener("click",()=>act(h));
  h.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act(h)}});
  h.addEventListener("pointerenter",()=>{if(!openId&&h.id!=="catB")showTip(h,label)});
  h.addEventListener("focus",()=>{if(!openId)showTip(h,label)});
  h.addEventListener("pointerleave",hideTip);h.addEventListener("blur",hideTip);
});
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{if(b.dataset.go)open(b.dataset.go);else{close();pet(b.dataset.cat)}});
$("#tgLamp").onclick=()=>{lampOn=!lampOn;click();lightsUp()};
$("#tgSound").onclick=()=>{sound=!sound;$("#tgSound").setAttribute("aria-pressed",sound)};
lightsUp();

/* ---------- what's inside each thing ---------- */
const ENTER={},LEAVE={};
const BUILD={
  books:el=>rBooks(el),
  records:rRecords,
  screen:rScreen,
  laptop:rLaptop,
  board:rBoard,
  games:rGames
};

{{RBOOKS}}

/* records */
let SPOT_API=null,spCtl=null,spOn=false;
function spotApi(){if(SPOT_API)return SPOT_API;
  SPOT_API=new Promise((res,rej)=>{window.onSpotifyIframeApiReady=api=>res(api);
    const sc=document.createElement("script");sc.src="https://open.spotify.com/embed/iframe-api/v1";sc.async=true;sc.onerror=rej;document.head.appendChild(sc);
    setTimeout(()=>rej(new Error("timeout")),8000)});
  SPOT_API.catch(()=>{});return SPOT_API}
function setSpin(on){spOn=on;svg.classList.toggle("music",on);const t=$("#tt");t&&t.classList.toggle("on",on);const b=$("#ttPlay");if(b){b.textContent=on?"❚❚":"▶";b.setAttribute("aria-label",on?"Pause":"Play")}}
function rRecords(v){
  v.innerHTML=`<div class="hifi"><div><div class="tt" id="tt"><div class="platter"><div class="rec"><div class="lab" id="ttLab"></div></div></div><div class="tarm"></div><button class="ttbtn" id="ttPlay" aria-label="Play">▶</button></div>
    <p class="small" id="ttNote">Spotify plays a preview unless you're logged in to Spotify in this browser. <a id="spOpen" target="_blank" rel="noopener">Open in Spotify ↗</a></p></div>
    <div class="crate">${PLAYLISTS.map((p,i)=>`<button class="sleeve" data-i="${i}" style="--c:${p.c}" aria-pressed="false"><b>${esc(p.name)}</b><span>${esc(p.mood)}</span></button>`).join("")}</div></div>
    <div class="spot-host" id="spHost"></div>`;
  let cur=-1;
  function load(i,autoplay){
    cur=i;const p=PLAYLISTS[i];
    v.querySelectorAll(".sleeve").forEach(s=>s.setAttribute("aria-pressed",+s.dataset.i===i));
    $("#ttLab").textContent=p.name;$("#spOpen").href="https://open.spotify.com/playlist/"+p.spotify;$("#ttLab").style.setProperty("--c",p.c);$("#recLabel").setAttribute("fill",getComputedStyle(document.documentElement).getPropertyValue(p.c.replace(/var\((.*)\)/,"$1")).trim()||"#F2B230");
    setSpin(false);
    const host=$("#spHost");host.innerHTML='<div id="spSlot"></div>';
    spotApi().then(api=>{
      if(spCtl){try{spCtl.destroy()}catch(e){}spCtl=null}
      api.createController($("#spSlot"),{uri:"spotify:playlist:"+p.spotify,width:"100%",height:352},c=>{spCtl=c;
        c.addListener("playback_update",e=>{const d=e.data||{};setSpin(!d.isPaused&&!d.isBuffering?true:d.isBuffering?spOn:false)});
        if(autoplay)c.play()})})
    .catch(()=>{host.innerHTML=`<iframe src="https://open.spotify.com/embed/playlist/${encodeURIComponent(p.spotify)}?utm_source=generator" height="352" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" title="${esc(p.name)} on Spotify"></iframe>`})
  }
  v.querySelectorAll(".sleeve").forEach(s=>s.onclick=()=>load(+s.dataset.i,true));
  $("#ttPlay").onclick=()=>{if(spCtl){spCtl.togglePlay();if(!spOn)setSpin(true)}else{setSpin(!spOn)}};
  load(0,false);
}

/* screen */
const TV=[
  {cat:"Movie",title:"Tony",by:"Matt Johnson · A24",yt:"k1MVnzd2aVc",c:"#FFC1D3",note:"Young Anthony Bourdain, before the books and the TV. Kitchen chaos, big appetite, and a reminder that everyone starts as a line cook."},
  {cat:"Series",title:"Mad Men",by:"AMC · 2007–2015",yt:"RTMk-xy2dTY",c:"#FFE6A8",note:"Don Draper, Madison Avenue and the 1960s."},
  {cat:"Animation",title:"BoJack Horseman",by:"Netflix · 2014–2020",yt:"i1eJMig5Ik4",c:"#BFD4FF",note:"A washed-up 90s sitcom horse in Hollywoo."}
];
function rScreen(v){
  v.innerHTML=`<div class="tvset"><div class="tvscr" id="tvScr"><div><b>NO SIGNAL</b><span>turn the dial →</span></div></div>
    <div class="chans">${TV.map((x,i)=>`<button class="chan" data-i="${i}" style="--c:${x.c}" aria-pressed="false"><i></i><span><small>ch ${i+1} · ${esc(x.cat)}</small><b>${esc(x.title)}</b></span></button>`).join("")}</div></div>
    <div class="tvinfo" id="tvInfo"></div>`;
  v.querySelectorAll(".chan").forEach(b=>b.onclick=()=>{
    const x=TV[+b.dataset.i],scr=$("#tvScr");v.querySelectorAll(".chan").forEach(o=>o.setAttribute("aria-pressed",o===b));click();
    scr.classList.add("static");scr.innerHTML="";
    $("#tvInfo").innerHTML=`<h3>${esc(x.title)}</h3><span class="by">${esc(x.cat)} · ${esc(x.by)}</span><p>${esc(x.note)}</p><p class="out">Trailer not loading? <a href="https://www.youtube.com/watch?v=${encodeURIComponent(x.yt)}" target="_blank" rel="noopener">Watch it on YouTube ↗</a></p>`;
    setTimeout(()=>{scr.classList.remove("static");scr.innerHTML=`<iframe src="https://www.youtube.com/embed/${encodeURIComponent(x.yt)}?autoplay=1&rel=0&playsinline=1" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" allowfullscreen title="${esc(x.title)} trailer"></iframe>`},reduce?0:450);
    svg.classList.add("movie")});
}
LEAVE.screen=()=>{const s=$("#tvScr");if(s){s.classList.remove("static");s.innerHTML=`<div><b>NO SIGNAL</b><span>turn the dial →</span></div>`}svg.classList.remove("movie");document.querySelectorAll(".chan").forEach(o=>o.setAttribute("aria-pressed","false"))};

/* laptop */
function rLaptop(v){
  const apps=[["writing","✎","var(--sun)"],["this week","☼","var(--pink)"],["mailing list","✉","var(--mint)"]];
  v.innerHTML=`<div class="os"><div class="os-bar"><span class="menus"><b>✿</b><b>File</b><b>Edit</b><b>View</b><b>Special</b></span><span id="osClock"></span></div><div class="os-main"><nav class="os-apps">${apps.map((a,i)=>`<button class="app" data-i="${i}" aria-pressed="${i===0}"><i style="--c:${a[2]}">${a[1]}</i>${a[0]}</button>`).join("")}</nav>
    <div class="win"><div class="win-t"><i></i><span id="winT"></span></div><div class="win-b" id="winB"></div></div></div></div>`;
  let open=0;
  const show=i=>{v.querySelectorAll(".app").forEach(a=>a.setAttribute("aria-pressed",+a.dataset.i===i));$("#winT").textContent=["cold_coffee_hot_takes.txt","this_week.txt","mailing_list.app"][i];
    const b=$("#winB");
    if(i===0){const list=[...WRITING].sort((a,b)=>b.d.localeCompare(a.d));
      const draw=()=>{b.innerHTML=list.map((w,j)=>{const dt=new Date(w.d+"T12:00:00");return `<article class="essay"><button aria-expanded="${j===open}" data-j="${j}"><span class="d">${dt.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}</span><h3>${esc(w.t)}</h3><span class="rt">${w.min} min ${j===open?"−":"+"}</span></button><div class="body" ${j===open?"":"hidden"}><div class="tags">${w.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>${w.sub?`<p class="sub">${esc(w.sub)}</p>`:""}${w.p.map(p=>`<p>${esc(p)}</p>`).join("")}${w.u?`<p><a class="more" href="${w.u}" target="_blank" rel="noopener">Read the full piece on Substack ↗</a></p>`:""}</div></article>`}).join("");
        b.querySelectorAll(".essay > button").forEach(x=>x.onclick=()=>{const j=+x.dataset.j;open=open===j?-1:j;draw()})};draw()}
    else if(i===1){const d=DIGEST[0],TC={Watched:"#FFC1D3",Read:"#FFE6A8",Listened:"#BFD4FF",Played:"#9BE3B5"};
      b.innerHTML=`<p class="wk-top">${esc(d.top)}</p><ul class="wk">${d.items.map(x=>`<li><span class="ty" style="--c:${TC[x.type]||"#eee"}">${esc(x.type.toLowerCase())}</span><div><b>${esc(x.title)}</b> <span class="by">${esc(x.by)} · ${"★".repeat(x.r)}</span><p>${esc(x.note)}</p></div></li>`).join("")}</ul><p class="small">${esc(d.date)}</p>`}
    else{b.innerHTML=`<form class="mail" id="mail"><label for="email">A letter now and then: what I'm reading, playing and watching.</label><div class="row"><input id="email" type="email" placeholder="you@example.com" autocomplete="email"><button>Sign me up</button></div><p class="small" id="mailNote" aria-live="polite"></p></form>`;
      $("#mail").onsubmit=e=>{e.preventDefault();const val=$("#email").value.trim();$("#mailNote").textContent=/^\S+@\S+\.\S+$/.test(val)?"Thanks! (This form isn't connected to a newsletter tool yet, so nothing was sent.)":"Add an email address with an @ and a domain."}}};
  v.querySelectorAll(".app").forEach(a=>a.onclick=()=>show(+a.dataset.i));show(0);
  const tick=()=>{const c=$("#osClock");if(c)c.textContent=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})};tick();setInterval(tick,30000);
}

/* corkboard */
/* PS2 games */
function rGames(v){
  v.innerHTML=`<div class="games"><div class="cases">${GAMES.map((g,i)=>`<button class="case" data-i="${i}" style="--c:${g.c};--fg:${g.fg}" aria-pressed="false"><i>${esc(g.title.split(":")[0])}</i><span><b>${esc(g.title)}</b><small>${esc(g.by)}</small></span></button>`).join("")}</div>
    <div><div class="gvid" id="gVid"></div><div class="greview" id="gRev"></div></div></div>`;
  v.querySelectorAll(".case").forEach(b=>b.onclick=()=>{GAMESEL=+b.dataset.i;showGame(true)});
}
function showGame(auto){
  const i=GAMESEL??0,g=GAMES[i],v=$("#v-games");if(!v||!g)return;
  v.querySelectorAll(".case").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.i===i));
  $("#gVid").innerHTML=`<iframe src="https://www.youtube.com/embed/${encodeURIComponent(g.yt)}?rel=0&playsinline=1${auto?"&autoplay=1":""}" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" allowfullscreen title="${esc(g.title)} gameplay"></iframe>`;
  $("#gRev").innerHTML=`<small>My take</small><h3>${esc(g.title)}</h3><p>${esc(g.review)}</p><p class="out">Video not loading? <a href="https://www.youtube.com/watch?v=${encodeURIComponent(g.yt)}" target="_blank" rel="noopener">Watch the gameplay on YouTube ↗</a></p>`;
}
ENTER.games=()=>showGame(GAMESEL!=null);
LEAVE.games=()=>{const x=$("#gVid");if(x)x.innerHTML="";GAMESEL=null};

function rBoard(v){
  const C=["#FFF1D6","#9BE3B5","#FFE6A8","#FFC1D3","#BFD4FF"],P=["#F2542D","#3D57A6","#2E8A86","#F2B230"];
  v.innerHTML=`<div class="cork">${NEWSLETTERS.map((n,i)=>`<article class="card" style="--c:${C[i%C.length]};--r:${[-2,1.5,-1,2.2,-1.6][i%5]}deg;--pin:${P[i%P.length]}"><span class="stamp">${esc(n.tag)}</span><b>${esc(n.name)}</b><span class="by">${esc(n.by)} · ${esc(n.cad)}</span><p>${esc(n.why)}</p></article>`).join("")}</div>`;
}

const start=location.hash.slice(1);if(ROOMS[start])setTimeout(()=>open(start),300);
</script>
