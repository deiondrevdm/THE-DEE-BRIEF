<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dee's Room</title>
<meta name="description" content="Dee's room on the internet. Books, records, trailers, writing and two cats. Click around.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Patrick+Hand&family=Permanent+Marker&family=Oswald:wght@700&family=VT323&display=swap">
<style>
/* Layout: one illustrated bedroom fills the screen. Click an object and the camera zooms in; its contents open on a paper card. */
:root{
  --night:#1E1530;   /* the room's surroundings */
  --paper:#FBF1DE;   /* cards */
  --ink:#2A1E22;
  --muted:#6E5A5C;
  --white:#FFFDF6;
  --tomato:#F2542D; --sun:#F2B230; --teal:#2E8A86; --pink:#E86A8E; --cobalt:#3D57A6;
  --mint:#4CC38A; --sky:#5B9BFF; --lilac:#B39BFF; --tangerine:#FF9F1C; --glass:#F8E9C2;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --hand:"Patrick Hand","Comic Sans MS","Segoe Print",cursive;
  --type:"DM Sans","Helvetica Neue",Arial,sans-serif;
  --body:"DM Sans","Helvetica Neue",Arial,sans-serif;
  --pixel:"VT323","Courier New",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--white);font:16px/1.5 var(--body);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px dashed var(--sun);outline-offset:3px}

/* top bar + bottom nav */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--type);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#CDBBD0}
.brand b{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:0;text-transform:none;color:#FFD9E6;margin-right:10px;text-shadow:0 0 12px rgba(255,111,174,.7)}
.toggles{display:flex;gap:8px}
.tg{background:transparent;border:1.5px solid #5A4868;color:#E9DCEB;border-radius:999px;padding:5px 12px;font-family:var(--type);font-size:12px;letter-spacing:.06em;cursor:pointer}
.tg[aria-pressed="true"]{background:#FFE6A8;border-color:#FFE6A8;color:var(--ink)}
.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav span{font-family:var(--hand);font-size:20px;color:#CDBBD0;margin-right:4px;align-self:center}
.nav button{background:#2E2142;border:0;border-radius:999px;padding:6px 14px;font-family:var(--type);font-size:13px;color:#F3E6F4;cursor:pointer}
.nav button:hover{background:#FFE6A8;color:var(--ink)}

/* stage + scene */
.stage{position:relative;min-height:0}
.scroller{position:absolute;inset:0;overflow:auto;display:grid;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scene{margin:auto;position:relative;border-radius:6px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.scene svg{display:block;width:100%;height:100%}
.hot{cursor:pointer;outline:none;transition:filter .25s}
.hot:hover,.hot:focus-visible{filter:drop-shadow(0 0 3px #FFF6D8) drop-shadow(0 0 10px rgba(255,214,120,.9))}
.zoomed .hot{pointer-events:none}
.tip{position:absolute;z-index:6;pointer-events:none;background:var(--paper);color:var(--ink);font-family:var(--hand);font-size:20px;line-height:1.1;padding:5px 10px 6px;border:3px solid var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.35);transform:translate(-50%,calc(-100% - 16px)) rotate(-2deg);white-space:nowrap;opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.tip small{display:block;font-family:var(--type);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.hint{position:absolute;z-index:5;left:50%;top:14px;transform:translateX(-50%) rotate(-1.5deg);background:#FFE6A8;color:var(--ink);font-family:var(--hand);font-size:21px;padding:4px 14px;box-shadow:3px 3px 0 rgba(0,0,0,.35);transition:opacity .5s;pointer-events:none;white-space:nowrap}
.hint.gone{opacity:0}

/* ambient animation inside the room */
.twinkle{animation:tw 3.2s ease-in-out infinite}
.posterpop{position:absolute;z-index:8;left:50%;top:50%;height:min(92%,680px);width:auto;max-width:94%;transform:translate(-50%,-50%);filter:drop-shadow(8px 10px 0 rgba(0,0,0,.35));pointer-events:none}
.posterpop.go{animation:pjump .45s cubic-bezier(.2,1.6,.4,1) both,headbang .16s ease-in-out .45s 9 alternate}
.posterpop.away{animation:paway .3s ease-in both}
@keyframes pjump{from{transform:translate(-50%,-30%) scale(.25) rotate(-12deg);opacity:0}to{transform:translate(-50%,-50%) scale(1) rotate(-3deg);opacity:1}}
@keyframes headbang{from{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}to{transform:translate(-50%,-47%) scale(1.04) rotate(3deg)}}
@keyframes paway{to{transform:translate(-50%,-40%) scale(.3) rotate(8deg);opacity:0}}
.nbtext{display:none}
.nbpage{position:absolute;z-index:8;left:50%;top:50%;width:min(680px,92%);aspect-ratio:1.55;display:grid;grid-template-columns:1fr 22px 1fr;
  background:#F2543D;border:3px solid var(--ink);border-radius:10px;padding:10px;box-shadow:8px 10px 0 rgba(0,0,0,.35);transform:translate(-50%,-50%) rotate(-2deg);cursor:pointer}
.nbpage.show{animation:nbin .45s cubic-bezier(.25,1.4,.5,1) both}
.nbpage.hide{animation:nbout .28s ease-in both}
@keyframes nbin{from{opacity:0;transform:translate(-50%,-40%) rotate(-6deg) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) rotate(-2deg) scale(1)}}
@keyframes nbout{to{opacity:0;transform:translate(-50%,-44%) rotate(-4deg) scale(.85)}}
.nbl,.nbr{background:#FFFBF2 repeating-linear-gradient(transparent 0 26px,#9DB4F0 26px 27px);background-position:0 30px;border:2px solid var(--ink);position:relative}
.nbl{border-radius:4px 0 0 4px}.nbr{border-radius:0 4px 4px 0;display:grid;place-items:center;padding:6%}
.nbl::before,.nbr::before{content:"";position:absolute;top:0;bottom:0;left:22%;width:1.5px;background:#F2A0A0}
.nbspiral{background:radial-gradient(circle at 50% 50%,transparent 4.5px,var(--ink) 5px 6.5px,transparent 7px) 50% 6px/22px 22px repeat-y}
.nbr p{margin:0;font-family:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;font-size:clamp(22px,4vw,40px);line-height:1.15;color:#141118;transform:rotate(-4deg);text-align:center;
  clip-path:inset(0 100% 0 0);animation:write 1.1s steps(28) .45s forwards}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){.nbr p{clip-path:none}}
.cflame{opacity:0;transition:opacity .25s}
#candles.lit .cflame{opacity:1}
#candles.lit .cflame path:first-of-type{transform-box:fill-box;transform-origin:50% 100%;animation:flick2 1.1s ease-in-out infinite alternate}
#candles.lit .cflame:nth-of-type(2) path:first-of-type{animation-duration:.9s}
#candles.lit .cglow{animation:cglow 1.6s ease-in-out infinite alternate}
@keyframes flick2{0%{transform:scale(1,1) rotate(-3deg)}50%{transform:scale(.92,1.08) rotate(2deg)}100%{transform:scale(1.04,.94) rotate(-1deg)}}
@keyframes cglow{to{opacity:.6;transform:scale(1.15)}}
.smoke path{fill:none;stroke:#F4F0FA;stroke-width:3;stroke-linecap:round;opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:smoke 7s ease-in infinite}
.smoke path:nth-child(2){animation-delay:2.3s}.smoke path:nth-child(3){animation-delay:4.6s}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.8)}15%{opacity:.55}100%{opacity:0;transform:translate(14px,-80px) scale(1.6,1.4)}}
.ember{animation:ember 2.6s ease-in-out infinite}
.exhale circle{fill:#F4F0FA;opacity:0;transform-box:fill-box;transform-origin:center;animation:exhale 9s ease-out infinite}
.exhale circle:nth-child(2){animation-delay:.25s}.exhale circle:nth-child(3){animation-delay:.5s}
@keyframes exhale{0%,62%{opacity:0;transform:translate(0,0) scale(.4)}68%{opacity:.75}100%{opacity:0;transform:translate(-26px,-30px) scale(2.2)}}
.jointg{transform-box:fill-box;transform-origin:30% 100%}
.jface{display:none}.talking .jface{display:inline}
.talking .jointg{animation:jjump 1.1s cubic-bezier(.3,1.5,.5,1) both}
@keyframes jjump{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-14px) rotate(-14deg)}55%{transform:translateY(-9px) rotate(-8deg)}75%{transform:translateY(-12px) rotate(-12deg)}100%{transform:translateY(-10px) rotate(-10deg)}}
.girl .roll{display:none}.girl.annoyed .roll{display:inline}.girl.annoyed .eyes-c{display:none}
.girl .pup{transform-box:fill-box;transform-origin:center}
.girl.annoyed .pup{animation:eyeroll 1.3s ease-in-out .25s both}
@keyframes eyeroll{0%{transform:translate(0,0)}35%{transform:translate(-1.6px,-2.8px)}70%{transform:translate(1.6px,-3px)}100%{transform:translate(1px,-1.6px)}}
.bubble{position:absolute;z-index:7;max-width:240px;background:#FFFDF6;color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:10px 16px 12px;font-family:var(--hand);font-size:clamp(18px,2.2vw,24px);line-height:1.15;box-shadow:4px 5px 0 rgba(0,0,0,.35);transform-origin:0 100%;animation:pop .35s cubic-bezier(.3,1.6,.5,1) both;pointer-events:none}
.bubble::after{content:"";position:absolute;left:-14px;bottom:14px;width:18px;height:18px;background:#FFFDF6;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:skewY(-30deg) rotate(20deg)}
.bubble.left{transform-origin:100% 100%}.bubble.left::after{left:auto;right:-14px;transform:skewY(30deg) rotate(-20deg) scaleX(-1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.exhale2 circle{fill:#F4F0FA;opacity:0;transform-box:fill-box;transform-origin:center;animation:exhale2 12s ease-out infinite}
.exhale2 circle:nth-child(2){animation-delay:.2s}.exhale2 circle:nth-child(3){animation-delay:.4s}
@keyframes exhale2{0%,34%{opacity:0;transform:translate(0,0) scale(.4)}39%{opacity:.8}54%,100%{opacity:0;transform:translate(10px,-34px) scale(2.3)}}
.ash circle{fill:#9C97AA;opacity:0;animation:ashfall 12s linear infinite}
.ash circle:nth-child(2){animation-delay:.1s}.ash circle:nth-child(3){animation-delay:.2s}
@keyframes ashfall{0%,57%{opacity:0;transform:translateY(0)}58%{opacity:1}66%{opacity:1;transform:translateY(12px)}70%,100%{opacity:0;transform:translateY(12px)}}
@keyframes ember{50%{fill:#FFB04A}}
@keyframes tw{50%{opacity:.55}}
.steam path{animation:steam 3.5s ease-in-out infinite;opacity:0}
.steam path:nth-child(2){animation-delay:1.2s}
@keyframes steam{20%{opacity:.7}100%{opacity:0;transform:translateY(-22px)}}
.blob{animation:lava 9s ease-in-out infinite}
.blob.b2{animation-duration:12s;animation-delay:-4s}
@keyframes lava{50%{transform:translateY(-46px) scale(1.15,.9)}}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.02,1.05)}}
.cat.purring .breathe{animation:purr .07s linear infinite}
@keyframes purr{50%{transform:translate(.6px,-.6px) scale(1.01,1.03)}}
.leg{transform-box:fill-box;transform-origin:50% 0;animation:step .5s ease-in-out infinite alternate}
.leg.b{animation-delay:-.5s}
@keyframes step{from{transform:rotate(16deg)}to{transform:rotate(-16deg)}}
.walker{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2px)}}
#catB .breathe{animation:none}
.cat.purring .leg,.cat.purring .walker,#catB.idle .leg,#catB.idle .walker{animation-play-state:paused}
#catB.run .leg{animation-duration:.14s}#catB.run .walker{animation-duration:.14s}
#catB .tail{animation-duration:1.4s}
#catA .mad,#catA .paw{display:none}#catA.angry .paw{display:inline;transform-box:fill-box;transform-origin:100% 100%;animation:swipe .32s ease-in-out 4 alternate}
@keyframes swipe{from{transform:rotate(38deg)}to{transform:rotate(-22deg)}}
#catA .mad{display:none}#catA.angry .mad{display:inline}#catA.angry .sleep{display:none}
#catA .head{transform-box:fill-box;transform-origin:70% 60%}
#catA.angry .head{animation:lunge .18s ease-out 4 alternate}
#catA.angry .breathe{animation:none}
@keyframes lunge{to{transform:translate(-9px,-5px) rotate(-8deg)}}
.miata-mad .zz{display:none}
.hiss{font-family:var(--display);font-size:30px;fill:#FFE6A8;paint-order:stroke;stroke:#2A1E22;stroke-width:5px;animation:prr 1.6s ease-out forwards}
.car .wh{transform-box:fill-box;transform-origin:50% 50%}
.car.vroom .carbody{animation:vroom 1.1s cubic-bezier(.5,0,.3,1)}
.car.vroom .wh{animation:rot .25s linear 4}
@keyframes vroom{0%{transform:translateX(0)}18%{transform:translateX(-5px)}55%{transform:translateX(14px)}100%{transform:translateX(0)}}
.lava-burst .blob{animation-duration:2.4s!important}
#catB.purring .breathe{animation:purr .07s linear infinite}
.cat .tail{transform-box:fill-box;transform-origin:100% 50%;animation:swish 5s ease-in-out infinite}
@keyframes swish{50%{transform:rotate(-6deg)}}
.zz{font-family:var(--hand);fill:#FFF1D6;opacity:0;animation:zz 6s ease-out infinite}
.zz:nth-of-type(2){animation-delay:2s}
@keyframes zz{10%{opacity:.9}100%{opacity:0;transform:translate(14px,-40px)}}
.prr{font-family:var(--hand);font-size:26px;fill:#FFF6D8;paint-order:stroke;stroke:#2A1E22;stroke-width:4px;animation:prr 2.4s ease-out forwards}
.heart{animation:prr 2.4s ease-out forwards}
@keyframes prr{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
.spin{transform-box:fill-box;transform-origin:50% 50%}
.music .spin{animation:rot 1.8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#arm{transition:transform 1s ease}
.music #arm{transform:rotate(36deg)}
#beam,#scrGlow{opacity:0;transition:opacity 1s}
.movie #beam{opacity:1}.movie #scrGlow{opacity:1}
#scrGlow rect{animation:flick 2.4s steps(6) infinite}
@keyframes flick{0%{fill:#7FB2FF}30%{fill:#FFC66B}55%{fill:#FF7FA8}80%{fill:#9BE3B5}}
#nightTint{transition:opacity .8s}
.glow{transition:opacity .8s;mix-blend-mode:screen}
#skyDay,#sun{transition:opacity .8s}
.neon{font-family:var(--display);font-weight:700;font-size:34px;fill:#FFE3EE;stroke:#FF6FAE;stroke-width:1.2px;filter:url(#neonGlow)}
.lamp-off .neon{animation:neon 5s infinite}
@keyframes neon{0%,92%,100%{opacity:1}93%{opacity:.4}95%{opacity:1}96%{opacity:.5}}

/* panel: the zoomed-in card */
.panel{position:absolute;inset:0;z-index:4;display:grid;place-items:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(ellipse at center,rgba(30,21,48,.15),rgba(30,21,48,.6));opacity:0;transition:opacity .4s}
.panel.on{opacity:1}
.pcard{width:100%;max-width:1060px;max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:8px 9px 0 rgba(0,0,0,.35);position:relative}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:18px 20px 0}
.phead h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1;margin:0;text-wrap:balance}
.phead p{font-family:var(--hand);font-size:21px;line-height:1.15;color:var(--muted);margin:4px 0 0}
.back{flex:none;width:44px;height:44px;display:grid;place-items:center;background:var(--ink);color:var(--white);border:0;border-radius:50%;font:700 28px/1 var(--body);cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.25);padding:0 0 3px}
.back:hover{background:var(--tomato)}
.pbody{padding:16px 20px 22px}
.view[hidden]{display:none!important}

{{ARTS_CSS}}
.arts{box-shadow:none}
.arts-h{font-size:clamp(34px,6vw,72px)}
.book-card{margin-top:12px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
#v-books .book-card h3{font-size:clamp(22px,2.4vw,30px)}
#v-books .book-card .by{margin:4px 0 6px;font-size:13px}
#v-books .book-card .why{font-size:16px;line-height:1.35}
#v-books .book-card .count{font-size:19px}
#v-books .verdict{gap:10px}
#v-books .verdict div{padding:10px 14px 8px;font-size:19px;line-height:1.1;background-image:none}
#v-books .arts-ctl{padding:8px 16px}
#v-books .arts-ctl button{width:36px;height:36px}
#v-books .pbody{padding-top:10px}
#v-books .arts-top{display:none}
#v-books .arts{padding-top:6px}
@media (max-height:800px){#v-books .phead h2{font-size:30px}#v-books .phead p{font-size:18px}}
@media (max-width:720px){.book-card{grid-template-columns:1fr}
  #v-books .phead p{display:none}
  #v-books .verdict{grid-template-columns:1fr 1fr}
  #v-books .verdict div{font-size:16px;padding:8px 10px 6px;transform:none}
  #v-books .book-card .why{font-size:14.5px}
  #v-books .book-card{gap:10px}}

/* records */
.hifi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
.tt{position:relative;border:3px solid var(--ink);aspect-ratio:1.25;max-width:100%;background:linear-gradient(160deg,#A8713D,#7A4A22);border-radius:10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 10px 0 #4E2E15,0 18px 30px rgba(0,0,0,.25)}
.platter{position:absolute;left:6%;top:9%;width:66%;aspect-ratio:1;border-radius:50%;background:#2B2420;box-shadow:inset 0 0 0 4px #3B332D}
.rec{position:absolute;inset:4%;border-radius:50%;background:repeating-radial-gradient(circle,#141010 0 2px,#1F1916 2px 4px);display:grid;place-items:center}
.rec::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 10%,rgba(255,255,255,.12) 14%,transparent 20% 60%,rgba(255,255,255,.08) 64%,transparent 70%)}
.lab{background-size:cover;background-position:center;width:36%;aspect-ratio:1;border-radius:50%;background:var(--c,var(--sun));display:grid;place-items:center;text-align:center;padding:8%;font-family:var(--hand);font-size:clamp(12px,1.4vw,16px);line-height:1;position:relative;z-index:1}
.lab::after{content:"";position:absolute;width:8%;aspect-ratio:1;border-radius:50%;background:#eee;left:46%;top:46%}
.tt.on .rec{animation:rot 1.8s linear infinite}
.tt.empty .rec{opacity:0}
.flydisc{position:fixed;z-index:60;border-radius:50%;pointer-events:none;background:repeating-radial-gradient(circle,#141010 0 2px,#1F1916 2px 4px);box-shadow:0 10px 24px rgba(0,0,0,.45);display:grid;place-items:center}
.flydisc::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 10%,rgba(255,255,255,.14) 14%,transparent 20% 60%,rgba(255,255,255,.08) 64%,transparent 70%)}
.flydisc i{width:36%;aspect-ratio:1;border-radius:50%;background:center/cover var(--c,#F2B230);border:2px solid #1F1916}
.nowp{position:absolute;z-index:6;left:14px;bottom:14px;display:flex;align-items:center;gap:10px;max-width:min(360px,calc(100% - 28px));background:#FFFDF6;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:8px 14px 8px 8px;box-shadow:4px 5px 0 rgba(0,0,0,.35);transform-origin:0 100%;animation:pop .35s cubic-bezier(.3,1.6,.5,1) both;cursor:pointer}
.nowp[hidden]{display:none}
.nowp .vin{flex:none;width:42px;height:42px;border-radius:50%;background:repeating-radial-gradient(circle,#141010 0 1.5px,#2A2224 1.5px 3px);display:grid;place-items:center;animation:rot 1.8s linear infinite}
.nowp .vin i{width:16px;height:16px;border-radius:50%;background:center/cover #F2B230}
.nowp small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nowp b{display:block;font-family:var(--display);font-weight:800;font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowp span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowp>div{min-width:0;text-align:left}
.tarm{position:absolute;right:9%;top:8%;width:9%;aspect-ratio:1;border-radius:50%;background:#D9D2C5;box-shadow:0 2px 0 #8E857A;transform-origin:50% 50%;transition:transform 1s ease;transform:rotate(-8deg)}

.dtitle{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;background:linear-gradient(90deg,#FF6FAE,#B39BFF 60%,#7FB2FF);color:#fff;font-weight:700;font-size:14px;text-shadow:1px 1px 0 var(--ink);border-bottom:3px solid var(--ink);border-radius:4px 4px 0 0}
.dtitle span{flex:1}
.dtitle b{width:22px;height:20px;display:grid;place-items:center;background:#E9E3F2;color:var(--ink);text-shadow:none;border:2px solid var(--ink);border-radius:3px;font-size:12px;line-height:1;box-shadow:inset -2px -2px 0 #B6ACC9}
.dbody{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;padding:18px 18px 10px}
.modem{width:72px;height:58px;position:relative}
.modem .box{position:absolute;left:0;right:0;bottom:4px;height:28px;background:#CFC6DE;border:2.5px solid var(--ink);border-radius:6px;box-shadow:inset -3px -3px 0 #A79DBB}
.modem .box i{position:absolute;top:9px;width:7px;height:7px;border-radius:50%;background:#5A5470;border:1.5px solid var(--ink)}
.modem .box i:nth-child(1){left:10px}.modem .box i:nth-child(2){left:22px}.modem .box i:nth-child(3){left:34px}
.dialing .modem .box i{animation:led .32s steps(2) infinite}.dialing .modem .box i:nth-child(2){animation-delay:.11s}.dialing .modem .box i:nth-child(3){animation-delay:.21s}
@keyframes led{50%{background:#7FDBA8}}
.modem .ph{position:absolute;left:14px;top:0;width:44px;height:16px;border:2.5px solid var(--ink);border-radius:10px 10px 4px 4px;background:#FF8FC2}
.dmsg h1{margin:0 0 4px;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;text-wrap:balance}
.dmsg p{margin:0;font-size:14px;line-height:1.4}
.dfield{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin-top:12px;font-size:13px}
.dfield code{font-family:"Courier New",monospace;background:#fff;border:2px solid var(--ink);box-shadow:inset 2px 2px 0 #CFC6DE;padding:3px 7px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dstatus{margin:10px 18px 0;font-size:13px;min-height:1.4em}
.dbar{margin:8px 18px 0;height:24px;background:#fff;border:2px solid var(--ink);box-shadow:inset 2px 2px 0 #CFC6DE;padding:2px;overflow:hidden}
.dbar div{height:100%;width:0;display:flex;gap:3px;transition:width .35s linear;overflow:hidden}
.dbar div::before{content:"♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥♥";color:#FF6FAE;font-size:16px;line-height:18px;letter-spacing:2px;white-space:nowrap}
.dbtns{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px 16px}
.dbtn{font:700 14px/1 var(--body);color:var(--ink);background:#E9E3F2;border:2.5px solid var(--ink);border-radius:4px;padding:9px 16px;cursor:pointer;box-shadow:inset -3px -3px 0 #B6ACC9,inset 3px 3px 0 #fff}
.dbtn:active{box-shadow:inset 3px 3px 0 #B6ACC9}
.dbtn.go{background:#FFE6A8}
.dbtn[disabled]{opacity:.5;cursor:default}
.dwin.welcome .dmsg h1{color:#E8577E}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
{{DATA}}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const NS="http://www.w3.org/2000/svg";
const svg=$("#room"),scene=$("#scene"),stage=$("#stage"),scroller=$("#scroller");

/* Rename the cats here. */
const GAMES=[
  {title:"Mixtape",by:"Beethoven & Dinosaur · Annapurna Interactive · 2025",yt:"iNkOgNAomio",c:"#FF6FAE",fg:"#2A1E22",review:"One last night with your best friends before everything changes, set to a soundtrack you'd actually put on a mixtape. Short, loud and very nostalgic."},
  {title:"Need for Speed: Underground 2",by:"EA Black Box · 2004 · PS2",yt:"4zdeNN2ex6E",c:"#151418",fg:"#FF9F1C",review:"Neon, rain-slicked streets and far too many hours in the body-kit menu. The reason the toy cars over my bed exist."},
  {title:"Animal Crossing: New Horizons",by:"Nintendo · 2020",yt:"_3YNL0OWio0",c:"#7FD36A",fg:"#2A1E22",review:"Paying off a raccoon's mortgage one fish at a time. The most peaceful bad financial decision I've ever made."}
];
let GAMESEL=null;
const CATS={catA:{name:"Miata",rate:23,pitch:1,tip:"do not touch"},catB:{name:"Supra",rate:27,pitch:1.25,tip:"catch her if you can"}}; /* catA: ginger on the bed (bites). catB: calico on the floor (runs, then purrs). */

const ROOMS={
  books:{t:"What I've been reading",s:""},
  records:{t:"Records",s:"Pick a sleeve, drop the needle. It keeps playing while you walk around the room."},
  screen:{t:"The TV",s:"What I've been watching."},
  games:{t:"What I've been playing",s:""},
  laptop:{t:"",s:""}
};
const TIPS={books:["the bookshelf","what I've been reading"],records:["the record player","playlists"],screen:["the TV","what I've been watching"],lava:["the lava lamp","click to change colour"],mirror:["the mirror","read the notes"],candles:["the candles","light them"],notebook:["my notebook","private"],poster:["the poster","don't"],girl:["don't bother her","she's listening to Phil Collins"],ash:["the ashtray","say hi"],f40:["Ferrari F40","1:18, do not touch"],r34:["Nissan Skyline GT-R R34","1:18, do not touch"],e30:["BMW E30","1:18, do not touch"],laptop:["the old Mac","writing & notes"],games:["the controller","what I've been playing"],lamp:["the lamp","on / off"],win:["the window","day / night"]};

function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e}
const rnd=Math.random;

/* ---------- sizing: the room keeps its 16:10 shape; on phones it scrolls sideways ---------- */
function size(){
  const W=stage.clientWidth,H=stage.clientHeight;let w,h;
  if(W/H>=1.6){h=H;w=H*1.6}else if(W>=760){w=W;h=W/1.6}else{h=H;w=H*1.6}
  scene.style.width=w+"px";scene.style.height=h+"px";return {W,w}}
const first=size();
if(first.w>first.W)scroller.scrollLeft=(first.w-first.W)/2+(1080/1600-.5)*first.w;
new ResizeObserver(size).observe(stage);

/* ---------- light, sound ---------- */
let lampOn=true,night=true,sound=true,AC=null;
function lightsUp(){
  svg.classList.toggle("lamp-off",!lampOn);
  $("#nightTint").style.opacity=night?(lampOn?.16:.52):(lampOn?0:.12);
  $("#lampGlow").style.opacity=lampOn?(night?.85:.35):0;
  $("#lampShade").setAttribute("fill",lampOn?"#FF7A45":"#C8502A");
  document.querySelectorAll(".glowb").forEach(b=>b.style.display=night?"":"none");
  $("#skyDay").style.opacity=night?0:1;$("#sun").style.opacity=night?0:1;
  $("#tgLamp").setAttribute("aria-pressed",lampOn);
}
function audio(){if(!sound)return null;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();AC.resume();return AC}catch(e){return null}}
function click(){const a=audio();if(!a)return;const n=a.sampleRate*.04,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,6);const s=a.createBufferSource();s.buffer=b;const g=a.createGain();g.gain.value=.35;s.connect(g).connect(a.destination);s.start()}
function purrSound(rate,pitch,dur=2.6){
  const a=audio();if(!a)return;const sr=a.sampleRate,n=Math.floor(sr*dur),buf=a.createBuffer(1,n,sr),d=buf.getChannelData(0);let b=0,mx=0;
  for(let i=0;i<n;i++){const t=i/sr;b=(b+.04*(Math.random()*2-1))*.985;
    const pulse=Math.pow(.5+.5*Math.sin(2*Math.PI*rate*t),3);
    const breath=.45+.55*Math.max(0,Math.sin(2*Math.PI*t/(dur/2)-.6));
    const env=Math.min(1,t/.2)*Math.min(1,(dur-t)/.4);
    d[i]=b*pulse*breath*env;mx=Math.max(mx,Math.abs(d[i]))}
  for(let i=0;i<n;i++)d[i]=d[i]/mx*.7;
  const s=a.createBufferSource();s.buffer=buf;const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=320*pitch;lp.Q.value=1.4;
  const g=a.createGain();g.gain.value=1.4;s.connect(lp).connect(g).connect(a.destination);s.start()}


/* ---------- sound effects (all synthesised, only when sound is on) ---------- */
window.SFX=null;const SFX={
  noise(a,dur){const n=a.sampleRate*dur|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;return s},
  env(a,t,peak,att,dec){const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0008,t+att+dec);return g},
  tone(type,f0,f1,t0,dur,vol){const a=audio();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=SFX.env(a,t,vol,.01,dur);o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05)},
  needle(){const a=audio();if(!a)return;const t=a.currentTime;
    SFX.tone("sine",90,45,0,.18,.5);
    const s=SFX.noise(a,1.6),hp=a.createBiquadFilter();hp.type="highpass";hp.frequency.value=1800;const g=a.createGain();g.gain.value=0;
    for(let k=0;k<26;k++){const tt=t+.12+Math.random()*1.4;g.gain.setValueAtTime(.35*Math.random(),tt);g.gain.setValueAtTime(0,tt+.006)}
    const hiss=SFX.noise(a,1.6),lp=a.createBiquadFilter();lp.type="bandpass";lp.frequency.value=3500;const hg=SFX.env(a,t+.1,.035,.1,1.4);
    s.connect(hp).connect(g).connect(a.destination);hiss.connect(lp).connect(hg).connect(a.destination);s.start(t);hiss.start(t)},
  crt(){const a=audio();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=SFX.env(a,t,.05,.03,.9);o.type="sine";o.frequency.setValueAtTime(15700,t);o.connect(g).connect(a.destination);o.start(t);o.stop(t+1);
    const s=SFX.noise(a,.5),bp=a.createBiquadFilter();bp.type="bandpass";bp.frequency.value=2400;bp.Q.value=.6;const sg=SFX.env(a,t,.25,.02,.42);s.connect(bp).connect(sg).connect(a.destination);s.start(t);
    SFX.tone("square",70,40,0,.08,.12)},
  ps2(){[[220,0],[330,.18],[440,.36],[659,.6]].forEach(([f,d],i)=>{SFX.tone("sine",f,null,d,1.4-d*.8,.12);SFX.tone("triangle",f*2,null,d,.9,.03)})},
  mac(){[261.6,329.6,392,523.3].forEach(f=>{SFX.tone("triangle",f,null,0,1.6,.07);SFX.tone("sine",f/2,null,0,1.8,.05)})},
  key(){const a=audio();if(!a)return;const t=a.currentTime,s=SFX.noise(a,.03),hp=a.createBiquadFilter();hp.type="highpass";hp.frequency.value=2500+Math.random()*1500;const g=SFX.env(a,t,.25,.002,.03);s.connect(hp).connect(g).connect(a.destination);s.start(t)},
  page(){const a=audio();if(!a)return;const t=a.currentTime,s=SFX.noise(a,.35),bp=a.createBiquadFilter();bp.type="bandpass";bp.Q.value=.8;bp.frequency.setValueAtTime(900,t);bp.frequency.exponentialRampToValueAtTime(4200,t+.3);const g=SFX.env(a,t,.3,.08,.25);s.connect(bp).connect(g).connect(a.destination);s.start(t)},
  lampClick(){SFX.tone("square",1800,600,0,.025,.18);SFX.tone("sine",140,60,0,.08,.4)},
  ting(){SFX.tone("sine",2637,null,0,1.1,.12);SFX.tone("sine",3951,null,0,.7,.05)},
  lighter(){const a=audio();if(!a)return;const t=a.currentTime;
    [0,.16].forEach(d=>{const s=SFX.noise(a,.04),hp=a.createBiquadFilter();hp.type="highpass";hp.frequency.value=3500;const g=SFX.env(a,t+d,.5,.002,.04);s.connect(hp).connect(g).connect(a.destination);s.start(t+d)});
    SFX.tone("square",2600,1800,.16,.02,.08);
    const w=SFX.noise(a,.7),bp=a.createBiquadFilter();bp.type="bandpass";bp.Q.value=.7;bp.frequency.setValueAtTime(500,t+.3);bp.frequency.exponentialRampToValueAtTime(1600,t+.5);bp.frequency.exponentialRampToValueAtTime(700,t+.95);
    const g=SFX.env(a,t+.3,.22,.08,.6);w.connect(bp).connect(g).connect(a.destination);w.start(t+.3)},
  puff(){const a=audio();if(!a)return;const t=a.currentTime,s=SFX.noise(a,.4),lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=900;const g=SFX.env(a,t,.35,.03,.32);s.connect(lp).connect(g).connect(a.destination);s.start(t)},
  marker(){const a=audio();if(!a)return;const t=a.currentTime;for(let k=0;k<5;k++){const tt=t+k*.16,s=SFX.noise(a,.14),bp=a.createBiquadFilter();bp.type="bandpass";bp.Q.value=3;bp.frequency.setValueAtTime(2200+Math.random()*900,tt);bp.frequency.linearRampToValueAtTime(3200,tt+.12);const g=SFX.env(a,tt,.18,.01,.12);s.connect(bp).connect(g).connect(a.destination);s.start(tt)}},
  mrrp(){const a=audio();if(!a)return;const t=a.currentTime,o=a.createOscillator(),f=a.createBiquadFilter(),g=SFX.env(a,t,.16,.02,.28);o.type="sawtooth";o.frequency.setValueAtTime(420,t);o.frequency.linearRampToValueAtTime(760,t+.12);o.frequency.linearRampToValueAtTime(620,t+.26);f.type="lowpass";f.frequency.value=1500;f.Q.value=4;o.connect(f).connect(g).connect(a.destination);o.start(t);o.stop(t+.32)}
};
/* room ambience: soft hum + occasional passing car */
const AMB={on:false,nodes:[],timers:[]};
function ambStop(){AMB.timers.forEach(clearInterval);AMB.timers=[];AMB.nodes.forEach(n=>{try{n.stop()}catch(e){}});AMB.nodes=[];AMB.on=false}
function ambStart(){
  const a=audio();if(!a||AMB.on)return;AMB.on=true;
  const hum=a.createOscillator(),hg=a.createGain();hum.type="sine";hum.frequency.value=58;hg.gain.value=.012;hum.connect(hg).connect(a.destination);hum.start();AMB.nodes.push(hum);
  const room=SFX.noise(a,4);room.loop=true;const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=380;const rg=a.createGain();rg.gain.value=.018;room.connect(lp).connect(rg).connect(a.destination);room.start();AMB.nodes.push(room);
  AMB.timers.push(setInterval(()=>{if(!sound||Math.random()<.55)return;const t=a.currentTime,s=SFX.noise(a,4),f=a.createBiquadFilter();f.type="lowpass";f.frequency.setValueAtTime(200,t);f.frequency.linearRampToValueAtTime(700,t+1.8);f.frequency.linearRampToValueAtTime(200,t+3.8);
    const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+1.8);g.gain.linearRampToValueAtTime(0,t+3.9);s.connect(f).connect(g).connect(a.destination);s.start(t)},9000));
}
window.SFX=SFX;
addEventListener("pointerdown",()=>{if(sound)ambStart()},{once:true});
addEventListener("keydown",()=>{if(sound)ambStart()},{once:true});

/* ---------- cats ---------- */
function svgPt(cx,cy){const m=svg.getScreenCTM();if(!m)return{x:0,y:0};const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(m.inverse())}
function svgBox(node){const r=node.getBoundingClientRect(),a=svgPt(r.left,r.top),b=svgPt(r.right,r.bottom);return{x:a.x,y:a.y,width:b.x-a.x,height:b.y-a.y}}
function floatText(words,bb,cls="prr"){const g=$("#fx");words.forEach((w,i)=>{const t=el("text",{x:bb.x+bb.width*(.1+i*.28),y:bb.y-4-i*20,class:cls,style:`animation-delay:${i*.35}s`},g);t.textContent=w;setTimeout(()=>t.remove(),3200)})}
function purr(id){
  const c=$("#"+id),cfg=CATS[id];if(!c)return;dismissHint();
  purrSound(cfg.rate,cfg.pitch);
  c.classList.add("purring");clearTimeout(c._t);c._t=setTimeout(()=>c.classList.remove("purring"),2600);
  const bb=svgBox(c),g=$("#fx");floatText(["prrr","prrrr…"],bb);
  for(let i=0;i<3;i++){const h=el("path",{d:"M0 4 C0 -2 8 -2 8 4 C8 -2 16 -2 16 4 C16 10 8 14 8 18 C8 14 0 10 0 4Z",fill:"#FF6FAE",class:"heart",transform:`translate(${bb.x+bb.width*(.2+i*.3)} ${bb.y+10})`,style:`animation-delay:${.2+i*.35}s;opacity:0`},g);setTimeout(()=>h.remove(),3400)}
  showTip(c,[cfg.name,"purring"]);
}
function hissSound(){const a=audio();if(!a)return;const t=a.currentTime,n=a.sampleRate*.9|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=b;const hp=a.createBiquadFilter();hp.type="highpass";hp.frequency.value=2600;const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.05);g.gain.exponentialRampToValueAtTime(.01,t+.9);s.connect(hp).connect(g).connect(a.destination);s.start(t);
  const o=a.createOscillator(),og=a.createGain();o.frequency.setValueAtTime(190,t+.05);o.frequency.exponentialRampToValueAtTime(60,t+.16);og.gain.setValueAtTime(.6,t+.05);og.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(og).connect(a.destination);o.start(t+.05);o.stop(t+.2)}
function swish(){const a=audio();if(!a)return;const t=a.currentTime,n=a.sampleRate*.25|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);
  const s=a.createBufferSource();s.buffer=b;const bp=a.createBiquadFilter();bp.type="bandpass";bp.Q.value=2;bp.frequency.setValueAtTime(600,t);bp.frequency.exponentialRampToValueAtTime(3200,t+.22);const g=a.createGain();g.gain.value=.5;s.connect(bp).connect(g).connect(a.destination);s.start(t)}
let miataBusy=false;
function miata(){
  const c=$("#catA");if(miataBusy||!c)return;miataBusy=true;dismissHint();
  hissSound();c.classList.add("angry");svg.classList.add("miata-mad");
  floatText(["HSSSS!","*swipe*","*chomp*"],svgBox(c),"hiss");setTimeout(swish,180);setTimeout(swish,820);showTip(c,["Miata","told you"]);
  setTimeout(()=>{c.classList.remove("angry");svg.classList.remove("miata-mad");showTip(c,["Miata","back to sleep"]);setTimeout(hideTip,1400);miataBusy=false},1900);
}
function pet(id){if(id==="catA")miata();else supraPoke()}

/* Supra wanders the floor, bolts when the pointer comes near, and gives in after a few escapes */
const SUP={x:300,y:560,tx:300,ty:560,state:"pause",wait:1,flees:0,tiredAt:0,lastNear:0,lastPurr:0,face:1};
const supPos=$("#supraPos"),supCat=$("#catB"),supFlip=supCat&&supCat.querySelector(".flip");
const toScr=(x,y)=>[640+x-.78*y,560+.2*x+.5*y];
const toFloor=(sx,sy)=>{const a=sx-640,b=sy-560,y=(b-.2*a)/.656;return[a+.78*y,y]};
const clampF=(x,y)=>{x=Math.max(280,Math.min(430,x));y=Math.max(470,Math.min(790-.4*x,y));return[x,y]};
const randF=()=>clampF(280+Math.random()*150,470+Math.random()*220);
let ptr=null;
function supFlee(px,py){
  let dx=SUP.x-px,dy=SUP.y-py,L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
  let [tx,ty]=clampF(SUP.x+dx*230,SUP.y+dy*230);
  if(Math.hypot(tx-SUP.x,ty-SUP.y)<90){let best=null,bd=-1;for(let k=0;k<10;k++){const c=randF(),d=Math.hypot(c[0]-px,c[1]-py);if(d>bd){bd=d;best=c}}[tx,ty]=best}
  if(SUP.state!=="run")SFX.mrrp();SUP.tx=tx;SUP.ty=ty;SUP.state="run";SUP.flees++;hideTip();
}
function supraPoke(){
  if(!supCat)return;dismissHint();
  if(reduce||SUP.state==="tired"){purr("catB");SUP.lastPurr=performance.now();return}
  const p=ptr||[SUP.x-60,SUP.y];supFlee(p[0],p[1]);
}
function supTick(now,dt){
  if(!supCat)return;
  if(ptr&&!openId){const d=Math.hypot(ptr[0]-SUP.x,ptr[1]-SUP.y);
    if(d<140){SUP.lastNear=now;
      if(SUP.state==="tired"){if(now-SUP.lastPurr>3500){SUP.lastPurr=now;purr("catB")}}
      else if(SUP.state!=="run")supFlee(ptr[0],ptr[1])}}
  if(SUP.state==="run"||SUP.state==="walk"){
    const sp=SUP.state==="run"?320:45,dx=SUP.tx-SUP.x,dy=SUP.ty-SUP.y,L=Math.hypot(dx,dy),step=sp*dt;
    const [sx0]=toScr(SUP.x,SUP.y);
    if(L<=step){SUP.x=SUP.tx;SUP.y=SUP.ty;
      if(SUP.state==="run"&&SUP.flees>=3){SUP.state="tired";SUP.tiredAt=now;SUP.lastPurr=now;purr("catB")}
      else{SUP.state="pause";SUP.wait=SUP.state==="run"?.4:1+Math.random()*2.5}}
    else{SUP.x+=dx/L*step;SUP.y+=dy/L*step}
    const [sx1]=toScr(SUP.x,SUP.y);if(Math.abs(sx1-sx0)>.01)SUP.face=sx1>sx0?1:-1;
  }else if(SUP.state==="pause"){SUP.wait-=dt;if(SUP.wait<=0&&!reduce){[SUP.tx,SUP.ty]=randF();SUP.state="walk"}}
  else if(SUP.state==="tired"){if(now-SUP.tiredAt>12000&&now-SUP.lastNear>6000){SUP.state="pause";SUP.wait=.5;SUP.flees=0}}
  const [sx,sy]=toScr(SUP.x,SUP.y);
  supPos.setAttribute("transform",`translate(${sx.toFixed(1)} ${sy.toFixed(1)})`);
  supFlip.setAttribute("transform",SUP.face<0?"scale(-1 1)":"");
  supCat.classList.toggle("run",SUP.state==="run");
  supCat.classList.toggle("idle",SUP.state==="pause"||SUP.state==="tired");
}
let lastT=performance.now();
(function loop(t){const dt=Math.min(.05,(t-lastT)/1000);lastT=t;if(!document.hidden)supTick(t,dt);requestAnimationFrame(loop)})(lastT);
scene.addEventListener("pointermove",e=>{const p=svgPt(e.clientX,e.clientY);ptr=toFloor(p.x,p.y)});
scene.addEventListener("pointerleave",()=>{ptr=null});

/* lava lamp + toy cars */
const LAVA=[["#FFB36E","#FF5C8A","#FFE6A8","#FF7A8A"],["#7FE0FF","#6A5CFF","#E6FBFF","#7FB2FF"],["#B6F09C","#1FB89A","#F4FFE0","#6FE3B0"],["#FFD36E","#C24BFF","#FFF4C2","#D98BFF"],["#FF6B6B","#7A1FA2","#FFD1E0","#FF6B9A"]];
let lavaI=0;
function lava(){
  lavaI=(lavaI+1)%LAVA.length;const [a,b,blob,glow]=LAVA[lavaI];dismissHint();
  $("#lava0").setAttribute("stop-color",a);$("#lava1").setAttribute("stop-color",b);
  document.querySelectorAll(".lavablob").forEach(x=>x.setAttribute("fill",blob));
  $("#lavaGlowStop").setAttribute("stop-color",glow);document.querySelector("#lavaGlowG stop:last-child").setAttribute("stop-color",glow);
  svg.classList.add("lava-burst");clearTimeout(lava._t);lava._t=setTimeout(()=>svg.classList.remove("lava-burst"),3000);
  const ac=audio();if(ac){const t=ac.currentTime;[0,.12,.26].forEach((d,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.setValueAtTime(420+i*90,t+d);o.frequency.exponentialRampToValueAtTime(160,t+d+.12);g.gain.setValueAtTime(.18,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+.14);o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+.15)})}
}
function grunt(){const a=audio();if(!a)return;const t=a.currentTime,o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();
  o.type="sawtooth";o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(92,t+.38);f.type="lowpass";f.frequency.value=700;f.Q.value=3;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.04);g.gain.setValueAtTime(.2,t+.22);g.gain.exponentialRampToValueAtTime(.001,t+.42);
  o.connect(f).connect(g).connect(a.destination);o.start(t);o.stop(t+.45)}
let girlBusy=false;
function girlTap(){
  const girl=$("#girl"),head=$("#girlHead"),bub=$("#bubble");if(girlBusy||openId||!girl)return;girlBusy=true;hideTip();
  const b=svgBox($("#girlFace"));scene.classList.add("zoomed");
  tween(fit({x:b.x-b.width*1.4,y:b.y-b.height*.9,w:b.width*4.4,h:b.height*2.6}),750,()=>{
    girl.classList.add("annoyed");grunt();
    const r=head.getBoundingClientRect(),st=stage.getBoundingClientRect();bub.textContent="I don't bother you in your bedroom..";bub.hidden=false;bub.classList.remove("left");
    let left=r.right-st.left+14,top=r.top-st.top-10;
    if(left+250>st.width){left=r.left-st.left-14-Math.min(240,bub.offsetWidth||240);bub.classList.add("left")}
    bub.style.left=Math.max(8,left)+"px";bub.style.top=Math.max(8,top)+"px";
    setTimeout(()=>{bub.hidden=true;girl.classList.remove("annoyed");
      tween(VB0,750,()=>{scene.classList.remove("zoomed");girlBusy=false})},2900);
  });
}
function boing(){const a=audio();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(820,t+.18);o.frequency.exponentialRampToValueAtTime(420,t+.36);g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.42);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.45)}
function sayAt(node,text,ms,done){
  const bub=$("#bubble"),r=node.getBoundingClientRect(),st=stage.getBoundingClientRect();bub.textContent=text;bub.hidden=false;bub.classList.remove("left");
  bub.style.animation="none";void bub.offsetWidth;bub.style.animation="";
  let left=r.right-st.left+14,top=r.top-st.top-24;
  if(left+260>st.width){left=r.left-st.left-14-Math.min(250,bub.offsetWidth||250);bub.classList.add("left")}
  bub.style.left=Math.max(8,left)+"px";bub.style.top=Math.max(8,top)+"px";
  setTimeout(()=>{bub.hidden=true;done&&done()},ms);
}
let jointBusy=false;
function jointTalk(node){
  const j=$("#joint");if(jointBusy||girlBusy||openId||!j)return;jointBusy=true;hideTip();
  const b=svgBox($("#jointBody"));scene.classList.add("zoomed");
  tween(fit({x:b.x-b.width*1.3,y:b.y-b.height*5.5,w:b.width*3.6,h:b.height*8}),750,()=>{
    node.classList.add("talking");boing();
    setTimeout(()=>sayAt($("#jointBody"),"I'm cheaper than therapy!",2500,()=>{node.classList.remove("talking");
      tween(VB0,750,()=>{scene.classList.remove("zoomed");jointBusy=false})}),380);
  });
}

}

      <div class="win" id="osWin" hidden><div class="win-t"><button class="close" id="winX" aria-label="Close window"></button><span id="winT"></span></div><div class="win-b" id="winB"></div></div>
    </div></div>`;
  let open=0;
  const W=$("#osWin"),T=$("#winT"),B=$("#winB");
  const press=id=>v.querySelectorAll(".icon").forEach(x=>x.setAttribute("aria-pressed",x.dataset.id===id));
  function show(id){
    press(id);W.hidden=false;W.className="win "+id;click();
    if(id==="writing"){T.textContent="my writing";const list=[...WRITING].sort((a,b)=>b.d.localeCompare(a.d));
      const draw=()=>{B.innerHTML=list.map((w,j)=>{const dt=new Date(w.d+"T12:00:00");return `<article class="essay"><button aria-expanded="${j===open}" data-j="${j}"><span class="d">${dt.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}</span><h3>${esc(w.t)}</h3><span class="rt">${w.min} min ${j===open?"−":"+"}</span></button><div class="body" ${j===open?"":"hidden"}><div class="tags">${w.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>${w.sub?`<p class="sub">${esc(w.sub)}</p>`:""}${w.p.map(p=>`<p>${esc(p)}</p>`).join("")}${w.u?`<p><a class="more" href="${w.u}" target="_blank" rel="noopener">Read the full piece on Substack ↗</a></p>`:""}</div></article>`}).join("");
        B.querySelectorAll(".essay > button").forEach(x=>x.onclick=()=>{const j=+x.dataset.j;open=open===j?-1:j;draw()})};draw()}
    else if(id==="web"){T.textContent="Google";const url="https://www.google.com/search?q="+encodeURIComponent(MOZ_Q);
      B.innerHTML=`<div class="moz"><div class="moz-bar"><span class="nb">◀</span><span class="nb">▶</span><span class="nb">↻</span><span class="addr">http://www.google.com/</span></div>
        <div class="gpage"><div class="glogo" aria-label="Google"><b>G</b><b>o</b><b>o</b><b>g</b><b>l</b><b>e</b></div>
        <div class="gbox"><span id="gq"></span><i class="caret"></i></div>
        <div class="gbtns"><a href="${url}" target="_blank" rel="noopener">Google Search</a><a href="${url}" target="_blank" rel="noopener">I'm Feeling Lucky</a></div></div></div>`;
      const q=$("#gq");let k=0;clearInterval(show._t);if(reduce){q.textContent=MOZ_Q;return}
      show._t=setInterval(()=>{q.textContent=MOZ_Q.slice(0,++k);if(MOZ_Q[k-1]!==" ")SFX.key();if(k>=MOZ_Q.length)clearInterval(show._t)},85)}
    else if(id==="week"){T.textContent="this_week.txt";const d=DIGEST[0],TC={Watched:"#FFC1D3",Read:"#FFE6A8",Listened:"#BFD4FF",Played:"#9BE3B5"};
      B.innerHTML=`<p class="wk-top">${esc(d.top)}</p><ul class="wk">${d.items.map(x=>`<li><span class="ty" style="--c:${TC[x.type]||"#eee"}">${esc(x.type.toLowerCase())}</span><div><b>${esc(x.title)}</b> <span class="by">${esc(x.by)} · ${"★".repeat(x.r)}</span><p>${esc(x.note)}</p></div></li>`).join("")}</ul><p class="small">${esc(d.date)}</p>`}
    else{T.textContent="mailing list";B.innerHTML=`<form class="mail" id="mail"><label for="email">A letter now and then: what I'm reading, playing and watching.</label><div class="row"><input id="email" type="email" placeholder="you@example.com" autocomplete="email"><button>Sign me up</button></div><p class="small" id="mailNote" aria-live="polite"></p></form>`;
      $("#mail").onsubmit=e=>{e.preventDefault();const val=$("#email").value.trim();$("#mailNote").textContent=/^\S+@\S+\.\S+$/.test(val)?"Thanks! (This form isn't connected to a newsletter tool yet, so nothing was sent.)":"Add an email address with an @ and a domain."}}
  }
  v.querySelectorAll(".icon").forEach(x=>x.onclick=()=>show(x.dataset.id));
  $("#winX").onclick=()=>{W.hidden=true;press("");clearInterval(show._t)};
  const tick=()=>{const c=$("#osClock");if(c)c.textContent=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})};tick();setInterval(tick,30000);
}
LEAVE.laptop=()=>{const w=$("#osWin");if(w)w.hidden=true;document.querySelectorAll("#v-laptop .icon").forEach(x=>x.setAttribute("aria-pressed","false"))};

function rGames(v){
  v.innerHTML=`<div class="games"><div class="cases">${GAMES.map((g,i)=>`<button class="case" data-i="${i}" style="--c:${g.c};--fg:${g.fg}" aria-pressed="false"><i>${esc(g.title.split(":")[0])}</i><span><b>${esc(g.title)}</b><small>${esc(g.by)}</small></span></button>`).join("")}</div>
    <div><div class="gvid" id="gVid"></div><div class="greview" id="gRev"></div></div></div>`;
  v.querySelectorAll(".case").forEach(b=>b.onclick=()=>{GAMESEL=+b.dataset.i;showGame(true)});
}
function showGame(auto){
  const i=GAMESEL??0,g=GAMES[i],v=$("#v-games");if(!v||!g)return;
  v.querySelectorAll(".case").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.i===i));
  $("#gVid").innerHTML=`<iframe src="https://www.youtube.com/embed/${encodeURIComponent(g.yt)}?rel=0&playsinline=1${auto?"&autoplay=1":""}" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" allowfullscreen title="${esc(g.title)} gameplay"></iframe>`;
  $("#gRev").innerHTML=`<small>My take</small><h3>${esc(g.title)}</h3><p>${esc(g.review)}</p><p class="out">Video not loading? <a href="https://www.youtube.com/watch?v=${encodeURIComponent(g.yt)}" target="_blank" rel="noopener">Watch the gameplay on YouTube ↗</a></p>`;
}
ENTER.games=()=>showGame(GAMESEL!=null);
LEAVE.games=()=>{const x=$("#gVid");if(x)x.innerHTML="";GAMESEL=null};

  v.innerHTML=`<div class="cork">${NEWSLETTERS.map((n,i)=>`<article class="card" style="--c:${C[i%C.length]};--r:${[-2,1.5,-1,2.2,-1.6][i%5]}deg;--pin:${P[i%P.length]}"><span class="stamp">${esc(n.tag)}</span><b>${esc(n.name)}</b><span class="by">${esc(n.by)} · ${esc(n.cad)}</span><p>${esc(n.why)}</p></article>`).join("")}</div>`;

/* ---------- dial-up intro ---------- */
(function(){
  const ov=$("#intro");if(!ov)return;
  let seen=false;try{seen=sessionStorage.getItem("dee-intro")==="1"}catch(e){}
  if(seen||ROOMS[location.hash.slice(1)]){ov.remove();return}
  const st=ov.querySelector(".stars");for(let i=0;i<40;i++){const d=document.createElement("i");d.style.left=Math.random()*100+"%";d.style.top=Math.random()*100+"%";d.style.animationDelay=(-Math.random()*3)+"s";st.appendChild(d)}
  const win=$("#dwin"),go=$("#dGo"),bar=$("#dBar"),msg=$("#dStatus");
  let timers=[],nodes=[];
  function stopSound(){nodes.forEach(n=>{try{n.stop()}catch(e){}});nodes=[]}
  function done(){timers.forEach(clearTimeout);stopSound();try{sessionStorage.setItem("dee-intro","1")}catch(e){}
    ov.classList.add("out");setTimeout(()=>ov.remove(),800);if(sound)ambStart()}
  function dialSound(){
    const a=audio();if(!a)return 0;const t0=a.currentTime+.05;
    const osc=(f,t,d,v,type="sine")=>{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.setValueAtTime(v,t+d-.01);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);nodes.push(o);return o};
    osc(350,t0,.9,.07);osc(440,t0,.9,.07);                     // dial tone
    const DT={0:[941,1336],8:[852,1336],D:[697,1633],E:[770,1633],S:[852,1477],R:[697,1209],O:[941,1336],M:[770,1336]};
    "0800DEESROOM".split("").forEach((c,i)=>{const [l,h]=DT[c]||[770,1336],t=t0+1+i*.13;osc(l,t,.09,.08);osc(h,t,.09,.08)});
    let t=t0+2.75;
    osc(2100,t,1.1,.06);t+=1.2;                                 // answer tone
    for(let k=0;k<4;k++){osc(980+k*120,t+k*.14,.11,.05,"square")}t+=.7;
    osc(1650,t,.35,.05);osc(1850,t+.35,.35,.05);osc(1200,t+.7,.5,.05,"sawtooth");t+=1.25;
    const n=a.sampleRate*2|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=a.createBufferSource();s.buffer=b;const bp=a.createBiquadFilter();bp.type="bandpass";bp.Q.value=1.2;bp.frequency.setValueAtTime(1800,t);bp.frequency.linearRampToValueAtTime(2600,t+1.9);
    const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.05);g.gain.setValueAtTime(.12,t+1.8);g.gain.linearRampToValueAtTime(0,t+2);
    s.connect(bp).connect(g).connect(a.destination);s.start(t);s.stop(t+2.05);nodes.push(s);
    osc(1500,t+.1,1.8,.035,"square");
    return t+2-a.currentTime;
  }
  go.onclick=()=>{
    go.disabled=true;win.classList.add("dialing");
    const len=(dialSound()||5.6)*1000;
    const steps=[[0,"Dialing 0800-DEES-ROOM…",8],[len*.33,"Verifying user name and password…",34],[len*.55,"Logging on to network…",58],[len*.78,"Feeding the cats…",82],[len,"Connected at 56.6 Kbps.",100]];
    steps.forEach(([at,txt,p])=>timers.push(setTimeout(()=>{msg.textContent=txt;bar.style.width=p+"%"},at)));
    timers.push(setTimeout(()=>{win.classList.remove("dialing");win.classList.add("welcome");
      $("#dTitle").textContent="Welcome to dee's room!";$("#dSub").textContent="Make yourself at home. Don't touch Miata.";
      go.disabled=false;go.textContent="Come in";go.onclick=done;go.focus()},len+300));
    timers.push(setTimeout(done,len+3200));
  };
  go.focus();
})();

const start=location.hash.slice(1);if(ROOMS[start])setTimeout(()=>open(start),300);
</script>
